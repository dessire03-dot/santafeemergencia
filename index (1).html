<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro de Insumos - Emergencia - Clínica Santa Fe</title>
<style>
  :root{
    --navy:#1F3B5C;
    --navy-dark:#152a44;
    --teal:#2f8f8a;
    --teal-light:#e8f4f3;
    --green:#3fae6a;
    --red:#c0392b;
    --amber:#c98a1f;
    --bg:#f5f7f9;
    --card:#ffffff;
    --border:#dbe2e8;
    --text:#1c2733;
    --text-mut:#6b7a89;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
  }
  .app{max-width:1100px;margin:0 auto;padding:16px 16px 80px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--navy); color:#fff; padding:10px 18px;border-radius:var(--radius);
    margin-bottom:16px; flex-wrap:wrap; gap:8px;
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .topbar .brand img{height:32px; border-radius:4px; background:#fff; padding:2px;}
  .topbar .brand .title{font-weight:700;font-size:15px;}
  .topbar .brand .role{font-size:11px; opacity:0.85; text-transform:uppercase; letter-spacing:0.04em;}
  .topbar .actions{display:flex;gap:8px;align-items:center;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:8px;
    padding:8px 14px; font-size:13px; font-weight:600; transition:opacity .15s, transform .05s;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{opacity:0.9;}
  .btn-ghost{background:rgba(255,255,255,0.12); color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,0.2);}
  .btn-outline{background:#fff; color:var(--navy); border:1px solid var(--border);}
  .btn-outline:hover{background:var(--teal-light);}
  .btn-danger{background:#fdecea; color:var(--red);}
  .btn-danger:hover{background:#fbdcd9;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn-icon{background:transparent; padding:4px 7px; font-size:14px; border-radius:6px;}
  .btn-icon:hover{background:#fdecea;}

  .role-select{display:flex; flex-direction:column; align-items:center; padding:60px 16px;}
  .role-select img{height:90px; margin-bottom:8px;}
  .role-select h1{font-size:20px; color:var(--navy); margin:4px 0 2px;}
  .role-select p{color:var(--text-mut); margin:0 0 32px;}
  .role-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; max-width:820px;}
  @media (max-width:720px){.role-cards{grid-template-columns:1fr;}}
  .role-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:24px 18px; text-align:center; cursor:pointer; transition:.15s;
  }
  .role-card:hover{border-color:var(--teal); box-shadow:0 4px 14px rgba(47,143,138,0.15); transform:translateY(-2px);}
  .role-card .icon{font-size:32px; margin-bottom:10px;}
  .role-card h3{margin:0 0 6px; color:var(--navy); font-size:16px;}
  .role-card p{margin:0; color:var(--text-mut); font-size:12.5px; line-height:1.4;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .card h2{margin:0 0 12px; font-size:16px; color:var(--navy);}

  .field-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  @media (max-width:700px){.field-grid{grid-template-columns:1fr 1fr;}}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--text-mut); margin-bottom:3px; text-transform:uppercase; letter-spacing:.02em;}
  .field input, .field textarea, .field select{
    width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:7px;
    font-size:13.5px; font-family:inherit; background:#fcfdfe;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--teal); outline-offset:0; border-color:var(--teal);}
  .field.span2{grid-column:span 2;}
  .field.span3{grid-column:span 3;}

  .search-bar{display:flex; gap:8px; margin-bottom:12px;}
  .search-bar input{flex:1; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:13.5px;}

  details.category{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    margin-bottom:8px; overflow:hidden;
  }
  details.category[open] summary{border-bottom:1px solid var(--border);}
  summary.cat-summary{
    padding:10px 14px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center;
    background:var(--navy); color:#fff; font-weight:700; font-size:12.5px; letter-spacing:.02em;
  }
  summary.cat-summary::-webkit-details-marker{display:none;}
  summary.cat-summary .badge{
    background:rgba(255,255,255,0.18); border-radius:20px; padding:2px 9px; font-size:11px; font-weight:600;
  }
  .cat-body{padding:8px;}
  .item-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
  @media (max-width:800px){.item-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:520px){.item-grid{grid-template-columns:1fr;}}
  .item-row{
    display:flex; align-items:flex-start; gap:6px; padding:6px 8px; border:1px solid var(--border);
    border-radius:7px; background:#fcfdfe;
  }
  .item-row.checked{background:var(--teal-light); border-color:var(--teal);}
  .item-row input[type=checkbox]{margin-top:2px; width:15px; height:15px; accent-color:var(--teal); flex-shrink:0;}
  .item-row .item-body{flex:1; min-width:0;}
  .item-row .item-label{font-size:12.5px; font-weight:600; line-height:1.3;}
  .item-row .item-extra{font-size:10.5px; color:var(--text-mut);}
  .item-row .qty-row{display:flex; gap:5px; margin-top:4px;}
  .item-row input.qty{width:52px; padding:3px 5px; font-size:12px; border:1px solid var(--border); border-radius:5px;}
  .item-row input.indic{flex:1; padding:3px 6px; font-size:12px; border:1px solid var(--border); border-radius:5px;}
  .item-row input.qty:disabled, .item-row input.indic:disabled{background:#f1f3f5; color:#aaa;}

  .price-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .price-table th{text-align:left; background:var(--navy); color:#fff; padding:7px 10px; position:sticky; top:0;}
  .price-table td{padding:6px 10px; border-bottom:1px solid var(--border);}
  .price-table tr:hover{background:var(--teal-light);}
  .price-table input.price-input{width:90px; padding:4px 6px; border:1px solid var(--border); border-radius:6px; font-size:12.5px;}
  .cat-header-row td{background:#eef2f5; font-weight:700; color:var(--navy); font-size:11.5px; text-transform:uppercase;}

  .list-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .list-item:hover{border-color:var(--teal);}
  .list-item .li-main{display:flex; flex-direction:column; gap:2px;}
  .list-item .li-name{font-weight:700; color:var(--navy); font-size:14px;}
  .list-item .li-meta{font-size:11.5px; color:var(--text-mut);}
  .list-item .li-right{text-align:right; display:flex; flex-direction:column; gap:2px; align-items:flex-end;}
  .list-item .li-total{font-weight:700; color:var(--teal); font-size:14px;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--text-mut);}

  .detail-header{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px 20px; margin-bottom:14px; font-size:13px;}
  @media (max-width:700px){.detail-header{grid-template-columns:1fr 1fr;}}
  .detail-header .dh-item .dh-label{font-size:10.5px; text-transform:uppercase; color:var(--text-mut); font-weight:700; letter-spacing:.03em;}
  .detail-header .dh-item .dh-value{font-size:13.5px; color:var(--text); font-weight:600;}

  .detail-cat{margin-bottom:14px;}
  .detail-cat h4{background:var(--navy); color:#fff; margin:0; padding:7px 12px; border-radius:8px 8px 0 0; font-size:12px; letter-spacing:.02em;}
  table.detail-table{width:100%; border-collapse:collapse; font-size:12.5px; border:1px solid var(--border); border-top:none;}
  table.detail-table th{text-align:left; background:#eef2f5; padding:6px 10px; font-size:11px; color:var(--text-mut); text-transform:uppercase;}
  table.detail-table td{padding:6px 10px; border-top:1px solid var(--border);}
  table.detail-table td.num{text-align:right; white-space:nowrap;}
  .total-bar{
    display:flex; justify-content:space-between; align-items:center; background:var(--navy); color:#fff;
    padding:14px 18px; border-radius:10px; margin-top:6px; font-size:15px; font-weight:700;
  }
  .total-bar .sub{font-size:11px; font-weight:500; opacity:0.8; text-transform:none;}

  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab-btn{background:#fff; border:1px solid var(--border); color:var(--text-mut);}
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:10px 20px; border-radius:30px; font-size:13px; font-weight:600;
    box-shadow:0 4px 16px rgba(0,0,0,0.25); z-index:999; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .save-bar{
    position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--border);
    padding:10px 14px; display:flex; justify-content:flex-end; gap:8px; margin:0 -16px; border-radius:0 0 var(--radius) var(--radius);
  }
  .note{font-size:11.5px; color:var(--text-mut); margin-top:2px;}
  .price-tag{font-size:10.5px; color:var(--amber); font-weight:700;}

  .add-item-box{border:1px dashed var(--teal); border-radius:10px; padding:12px; margin-bottom:14px; background:var(--teal-light);}
  .add-item-box h3{margin:0 0 8px; font-size:13px; color:var(--navy);}
  .add-item-grid{display:grid; grid-template-columns:1.3fr 1fr 1.6fr 1fr auto; gap:8px; align-items:end;}
  @media (max-width:820px){.add-item-grid{grid-template-columns:1fr 1fr;}}
  .add-item-grid .field label{font-size:10.5px;}
  .new-cat-row{display:flex; gap:6px; margin-top:6px;}
  .new-cat-row input{flex:1;}
</style>
</head>

<div id="root" class="app"></div>
<div id="toast" class="toast"></div>

// ---------- helpers ----------
function keyFor(catIdx, itemIdx){ return "b_"+catIdx+"_"+itemIdx; }
// Precio efectivo: el definido por Administración; si no hay, el del inventario (15/10/2026)
function effPrice(k){
  if(state.precios[k]!=null) return state.precios[k];
  return SUGGESTED_SALE_PRICES[k]!=null ? SUGGESTED_SALE_PRICES[k] : 0;
}
function money(n){
  n = Number(n)||0;
  return "L. " + n.toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function nowId(prefix){ return (prefix||'id') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
// Custom in-app confirmation (native confirm()/alert() are unreliable inside sandboxed preview frames)
function showConfirm(message){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,30,40,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:12px;padding:20px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.25);';
    box.innerHTML = `
      <div style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:16px;">${escapeHtml(message)}</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn-outline" id="confirm-no">Cancelar</button>
        <button class="btn-primary" id="confirm-yes">Confirmar</button>
      </div>
    `;
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const cleanup = (val)=>{ document.body.removeChild(overlay); resolve(val); };
    box.querySelector('#confirm-no').onclick = ()=>cleanup(false);
    box.querySelector('#confirm-yes').onclick = ()=>cleanup(true);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup(false); });
  });
}

// ---------- storage adapter ----------
// Prioridad: 1) window.storage (vista previa de Claude)  2) Google Sheets vía Apps Script (GitHub Pages / cualquier navegador)
// 3) db de Artifacts publicados  4) memoria (solo esta sesión)
const memStore = {};
const recCache = {};
let _dbP = null;
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbyrvLZqkefuCJeZhfzApUriOH6O4Q6pVrIVkiHDbhToYmwXQg6OukDexLobCn8ZynwNrw/exec';
function getApi(){
  try{
    const u = new URLSearchParams(location.search).get('api');
    if(u){ try{ localStorage.setItem('santafe_api', u); }catch(e){} return u; }
    return localStorage.getItem('santafe_api') || DEFAULT_API;
  }catch(e){ return DEFAULT_API; }
}
function setApi(u){ try{ if(u) localStorage.setItem('santafe_api', u); else localStorage.removeItem('santafe_api'); }catch(e){} }
async function remote(req){
  const r = await fetch(getApi(), { method:'POST', body: JSON.stringify(req) });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'error');
  return j;
}
function getDb(){
  if(_dbP) return _dbP;
  _dbP = (async()=>{
    try{ if(window.claude && window.claude.use) return await window.claude.use('db'); }catch(e){}
    return null;
  })();
  return _dbP;
}
async function storageMode(){
  if(window.storage) return 'storage';
  if(getApi()) return 'remote';
  return (await getDb()) ? 'db' : 'mem';
}
const CFG_KEYS = ['precios','custom_items','custom_categories','deleted_keys'];
function cGet(k){ try{ const v = localStorage.getItem('santafe_c_'+k); return v ? JSON.parse(v) : undefined; }catch(e){ return undefined; } }
function cSet(k,v){ try{ localStorage.setItem('santafe_c_'+k, JSON.stringify(v)); }catch(e){} }
async function getJSON(key, fallback, strict){
  let m = null;
  try{
    m = await storageMode();
    if(m==='storage'){
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : fallback;
    }
    if(m==='remote'){
      const j = await remote({op:'get', key:'kv/'+key});
      const val = j.v ? JSON.parse(j.v) : fallback;
      if(CFG_KEYS.indexOf(key)>=0) cSet(key, val);
      return val;
    }
    if(m==='db'){
      const db = await getDb();
      const snap = await db.doc('kv/'+key).get();
      return snap.exists ? JSON.parse(snap.data().v) : fallback;
    }
    return (key in memStore) ? JSON.parse(memStore[key]) : fallback;
  }catch(e){
    if(strict && (m==='remote' || m==='db')) throw e;
    return fallback;
  }
}
async function setJSON(key, val){
  try{
    const str = JSON.stringify(val);
    const m = await storageMode();
    if(m==='storage'){ await window.storage.set(key, str, true); return true; }
    if(m==='remote'){ await remote({op:'set', key:'kv/'+key, v:str}); if(CFG_KEYS.indexOf(key)>=0) cSet(key,val); return true; }
    if(m==='db'){ const db = await getDb(); await db.doc('kv/'+key).set({v:str}); return true; }
    memStore[key] = str; return true;
  }catch(e){
    showToast('⚠ No se pudo guardar. Revisa tu conexión a internet e inténtalo de nuevo.');
    return false;
  }
}

const COLS = {
  atenciones: {idx:'atenciones_index', pre:'atencion_'},
  hospitalizaciones: {idx:'hosp_index', pre:'hosp_'},
};
function summaryOf(rec){
  return { id:rec.id, nombre:rec.nombre||'(Sin nombre)', fecha:rec.fecha||rec.fechaIngreso||'', medico:rec.medico||'',
           updatedAt:rec.updatedAt, estado:rec.estado||'', cama:rec.cama||'' };
}
const _idxMemo = {};
async function getIndex(col){
  col = col || 'atenciones';
  const m = await storageMode();
  if(m==='remote'){
    const memo = _idxMemo[col];
    if(memo && Date.now()-memo.t < 15000) return memo.p;
    const p = (async()=>{
      try{
        const j = await remote({op:'list', prefix: col+'/'});
        const out = [];
        (j.docs||[]).forEach(d=>{ try{ const r = JSON.parse(d.v); recCache[col+'/'+r.id]=r; out.push(summaryOf(r)); }catch(e){} });
        return out;
      }catch(e){ delete _idxMemo[col]; return []; }
    })();
    _idxMemo[col] = {t:Date.now(), p};
    return p;
  }
  if(m==='db'){
    try{
      const db = await getDb();
      const qs = await db.collection(col).limit(1000).get();
      const out = [];
      qs.docs.forEach(d=>{ if(d.exists){ const r = JSON.parse(d.data().v); recCache[col+'/'+r.id]=r; out.push(summaryOf(r)); } });
      return out;
    }catch(e){ return []; }
  }
  return getJSON(COLS[col].idx, []);
}
const saveIndex = (v)=> setJSON('atenciones_index', v);
async function getAtencion(id, col, fresh){
  col = col || 'atenciones';
  const m = await storageMode();
  if(m==='remote' || m==='db'){
    if(!fresh && recCache[col+'/'+id]) return recCache[col+'/'+id];
    try{
      let r = null;
      if(m==='remote'){ const j = await remote({op:'get', key: col+'/'+id}); r = j.v ? JSON.parse(j.v) : null; }
      else { const db = await getDb(); const snap = await db.doc(col+'/'+id).get(); r = snap.exists ? JSON.parse(snap.data().v) : null; }
      if(r) recCache[col+'/'+id] = r;
      return r;
    }catch(e){ return null; }
  }
  return getJSON(COLS[col].pre+id, null);
}
async function saveAtencion(rec, col){
  col = col || 'atenciones';
  const m = await storageMode();
  if(m==='remote'){
    try{ await remote({op:'set', key: col+'/'+rec.id, v: JSON.stringify(rec)}); recCache[col+'/'+rec.id]=rec; delete _idxMemo[col]; return true; }
    catch(e){ showToast('⚠ No se pudo guardar. Revisa tu conexión a internet e inténtalo de nuevo.'); return false; }
  }
  if(m==='db'){
    try{ const db = await getDb(); await db.doc(col+'/'+rec.id).set({v: JSON.stringify(rec)}); recCache[col+'/'+rec.id]=rec; return true; }
    catch(e){ showToast('⚠ No se pudo guardar. Verifica que tengas permiso de Colaborador/Editor.'); return false; }
  }
  const ok = await setJSON(COLS[col].pre+rec.id, rec);
  let idx = await getIndex(col);
  const i = idx.findIndex(x=>x.id===rec.id);
  const summary = summaryOf(rec);
  if(i>=0) idx[i]=summary; else idx.unshift(summary);
  await setJSON(COLS[col].idx, idx);
  return ok;
}

function buildEffectiveCategories(){
  const deletedSet = new Set(state.deleted);
  const cats = BASE_CATEGORIES.map((cat, catIdx)=>({
    name: cat.name, type: cat.type, isCustomCat:false,
    items: cat.items.map((it,i)=>({ key:keyFor(catIdx,i), label:it.label, extra:it.extra })).filter(o=>!deletedSet.has(o.key)),
  }));
  state.customItems.forEach(ci=>{
    if(deletedSet.has(ci.id)) return;
    let cat = cats.find(c=>c.name===ci.catName);
    if(cat) cat.items.push({key:ci.id, label:ci.label, extra:ci.extra||null});
  });
  state.customCats.forEach(cc=>{
    const items = state.customItems.filter(ci=>ci.catName===cc.name && !deletedSet.has(ci.id))
      .map(ci=>({key:ci.id, label:ci.label, extra:ci.extra||null}));
    if(!cats.find(c=>c.name===cc.name)){
      cats.push({name:cc.name, type:cc.type, isCustomCat:true, items});
    }
  });
  return cats.filter(c=>c.items.length>0 || c.isCustomCat);
}

function buildAllItemsMap(){
  const map = {};
  BASE_CATEGORIES.forEach((cat, catIdx)=>{
    cat.items.forEach((it,i)=>{
      map[keyFor(catIdx,i)] = {label:it.label, extra:it.extra, type:cat.type, catName:cat.name};
    });
  });
  state.customItems.forEach(ci=>{
    const catType = (state.customCats.find(c=>c.name===ci.catName)||{}).type
      || (BASE_CATEGORIES.find(c=>c.name===ci.catName)||{}).type || ci.type || 'supply';
    map[ci.id] = {label:ci.label, extra:ci.extra, type: ci.type || catType, catName:ci.catName};
  });
  return map;
}

function allCategoryNames(){
  const names = BASE_CATEGORIES.map(c=>c.name);
  state.customCats.forEach(c=>{ if(!names.includes(c.name)) names.push(c.name); });
  return names;
}

function computeTotal(rec){
  const map = buildAllItemsMap();
  let total = 0;
  const byCatName = {};
  Object.keys(rec.items||{}).forEach(k=>{
    const cur = rec.items[k];
    if(!cur || !cur.checked) return;
    const info = map[k];
    if(!info) return;
    const price = Number(effPrice(k))||0;
    const qty = Number(cur.cantidad)||0;
    const subtotal = price * (qty||1);
    total += subtotal;
    if(!byCatName[info.catName]) byCatName[info.catName] = {name:info.catName, type:info.type, rows:[]};
    byCatName[info.catName].rows.push({label:info.label, extra:info.extra, cantidad:cur.cantidad, indicacion:cur.indicacion, price, subtotal});
  });
  return {total, byCat: Object.values(byCatName)};
}

function todayISO(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function emptyHosp(){
  return { id: nowId('hp'), nombre:'', edad:'', cama:'', fechaIngreso: todayISO(), medico:'', diagnostico:'',
           estado:'hospitalizado', fechaAlta:'', days:{}, createdAt:Date.now(), updatedAt:Date.now() };
}
function stayTotals(rec){
  const perDay = Object.keys(rec.days||{}).sort().map(day=>{
    const r = computeTotal({items: rec.days[day].items||{}});
    return {day, total:r.total, byCat:r.byCat, n:r.byCat.reduce((n,c)=>n+c.rows.length,0)};
  });
  return {perDay, total: perDay.reduce((n,d)=>n+d.total,0)};
}

async function collectBackup(){
  const out = { app:'registro-insumos-santafe', version:1, fecha:new Date().toISOString(),
    precios: await getPrecios(), custom_items: await getCustomItems(), custom_categories: await getCustomCats(), deleted_keys: await getDeleted(),
    atenciones:[], hospitalizaciones:[] };
  for(const col of ['atenciones','hospitalizaciones']){
    const idx = await getIndex(col);
    for(const it of idx){ const r = await getAtencion(it.id, col, true); if(r) out[col].push(r); }
  }
  return out;
}
async function downloadFile(filename, text){
  try{
    if(window.claude && window.claude.use){
      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename, data:text}); return; }
    }
  }catch(e){ return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function renderRespaldo(){
  const wrap = document.createElement('div');
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>💾 Respaldo de la información</h2>

  const row = document.createElement('div'); row.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;';
  const dlBtn = document.createElement('button'); dlBtn.className='btn-primary'; dlBtn.textContent='⬇ Descargar respaldo';
  dlBtn.onclick = async ()=>{
    dlBtn.disabled = true; dlBtn.textContent='Preparando...';
    const data = await collectBackup();
    const name = 'respaldo_santafe_'+todayISO()+'.json';
    await downloadFile(name, JSON.stringify(data));
    dlBtn.disabled = false; dlBtn.textContent='⬇ Descargar respaldo';
    showToast(`Respaldo: ${data.atenciones.length} atenciones, ${data.hospitalizaciones.length} hospitalizados`);
  };
  const file = document.createElement('input'); file.type='file'; file.accept='.json,application/json'; file.style.display='none';
  const upBtn = document.createElement('button'); upBtn.className='btn-outline'; upBtn.textContent='⬆ Restaurar desde respaldo';
  upBtn.onclick = ()=> file.click();
  file.onchange = async ()=>{
    const f = file.files[0]; if(!f) return;
    let data; try{ data = JSON.parse(await f.text()); }catch(e){ showToast('El archivo no es un respaldo válido'); return; }
    if(data.app!=='registro-insumos-santafe'){ showToast('El archivo no es un respaldo de esta app'); return; }
    if(!(await showConfirm(`Se restaurarán ${data.atenciones.length} atenciones, ${data.hospitalizaciones.length} hospitalizados y los precios del respaldo del ${data.fecha.slice(0,10)}. Lo que coincida se sobrescribirá. ¿Continuar?`))) return;
    await savePrecios(data.precios||{}); await saveCustomItems(data.custom_items||[]); await saveCustomCats(data.custom_categories||[]); await saveDeleted(data.deleted_keys||[]);
    for(const r of data.atenciones||[]) await saveAtencion(r,'atenciones');
    for(const r of data.hospitalizaciones||[]) await saveAtencion(r,'hospitalizaciones');
    state.precios = data.precios||{}; state.customItems = data.custom_items||[]; state.customCats = data.custom_categories||[]; state.deleted = data.deleted_keys||[];
    state.index = await getIndex();
    showToast('Respaldo restaurado'); file.value='';
  };
  row.appendChild(dlBtn); row.appendChild(upBtn); row.appendChild(file);
  card.appendChild(row); wrap.appendChild(card);
  return wrap;
}

function renderAdminTabs(){
  const tabs = document.createElement('div'); tabs.className='tabs';
  const t1 = document.createElement('button'); t1.className='tab-btn'+(state.adminTab==='atenciones'?' active':''); t1.textContent='Atenciones y totales';
  t1.onclick = ()=>{ state.adminTab='atenciones'; state.view='list'; render(); };
  const t2 = document.createElement('button'); t2.className='tab-btn'+(state.adminTab==='precios'?' active':''); t2.textContent='Insumos y precios';
  t2.onclick = ()=>{ state.adminTab='precios'; render(); };
  const t3 = document.createElement('button'); t3.className='tab-btn'+(state.adminTab==='resumen'?' active':''); t3.textContent='📊 Resumen';
  t3.onclick = ()=>{ state.adminTab='resumen'; render(); };
  const t4 = document.createElement('button'); t4.className='tab-btn'+(state.adminTab==='respaldo'?' active':''); t4.textContent='💾 Respaldo';
  t4.onclick = ()=>{ state.adminTab='respaldo'; render(); };
  tabs.appendChild(t1); tabs.appendChild(t2); tabs.appendChild(t3); tabs.appendChild(t4);
  return tabs;
}

// ---------- ADMIN: RESUMEN (por día / médico / paciente) ----------
function renderResumen(){
  const wrap = document.createElement('div');
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>📊 Resumen de consumo</h2><p class="note">Solo Administración puede ver estos resúmenes.</p>`;

  const subTabs = document.createElement('div'); subTabs.className='tabs'; subTabs.style.marginTop='10px';
  const groups = [['dia','Por día'],['medico','Por médico'],['paciente','Por paciente'],['hosp','Hospitalizados']];
  let activeGroup = 'dia';
  const btns = {};
  groups.forEach(([key,label])=>{
    const b = document.createElement('button'); b.className='tab-btn'+(key===activeGroup?' active':''); b.textContent=label;
    b.onclick = ()=>{ activeGroup=key; Object.keys(btns).forEach(kk=>btns[kk].classList.toggle('active', kk===key)); loadAndRender(); };
    btns[key]=b; subTabs.appendChild(b);
  });
  card.appendChild(subTabs);

  const tableWrap = document.createElement('div');
  tableWrap.innerHTML = `<div class="empty-state">Cargando...</div>`;
  card.appendChild(tableWrap);
  wrap.appendChild(card);

  async function loadAndRender(){
    tableWrap.innerHTML = `<div class="empty-state">Cargando...</div>`;
    if(activeGroup==='hosp'){
      const hi = await getIndex('hospitalizaciones'); const rows=[];
      for(const it of hi){ const r = await getAtencion(it.id,'hospitalizaciones'); if(r){ const st=stayTotals(r); rows.push([r.nombre+(r.estado==='alta'?' (alta)':''), st.perDay.filter(d=>d.n>0).length, st.total]); } }
      rows.sort((a,b)=>b[2]-a[2]);
      if(rows.length===0){ tableWrap.innerHTML = `<div class="empty-state">No hay pacientes hospitalizados registrados.</div>`; return; }
      const t = document.createElement('table'); t.className='price-table';
      t.innerHTML = `<thead><tr><th>Paciente</th><th>Días</th><th>Total acumulado</th></tr></thead>`;
      const tb = document.createElement('tbody');
      rows.forEach(r=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${escapeHtml(r[0])}</td><td>${r[1]}</td><td style="font-weight:700;color:var(--teal);">${money(r[2])}</td>`; tb.appendChild(tr); });
      t.appendChild(tb); tableWrap.innerHTML=''; tableWrap.appendChild(t);
      const tot = document.createElement('div'); tot.className='total-bar'; tot.style.marginTop='14px';
      tot.innerHTML = `<span>Total hospitalizados<br><span class="sub">${rows.length} paciente(s)</span></span><span>${money(rows.reduce((n,r)=>n+r[2],0))}</span>`;
      tableWrap.appendChild(tot); return;
    }
    state.index = await getIndex();
    const recs = [];
    for(const it of state.index){
      const r = await getAtencion(it.id);
      if(r) recs.push(r);
    }
    const groupKeyFn = activeGroup==='dia' ? (r=>r.fecha||'(sin fecha)')
      : activeGroup==='medico' ? (r=>r.medico||'(sin médico)')
      : (r=>r.nombre||'(sin nombre)');

    const agg = {};
    recs.forEach(r=>{
      const g = groupKeyFn(r);
      const {total} = computeTotal(r);
      if(!agg[g]) agg[g] = {count:0, total:0};
      agg[g].count += 1;
      agg[g].total += total;
    });
    const rows = Object.entries(agg).sort((a,b)=> b[1].total - a[1].total);

    if(rows.length===0){
      tableWrap.innerHTML = `<div class="empty-state">No hay atenciones registradas todavía.</div>`;
      return;
    }
    const grandTotal = rows.reduce((n,[,v])=>n+v.total,0);
    const grandCount = rows.reduce((n,[,v])=>n+v.count,0);

    const table = document.createElement('table'); table.className='price-table';
    const colLabel = activeGroup==='dia'?'Fecha':activeGroup==='medico'?'Médico':'Paciente';
    table.innerHTML = `<thead><tr><th>${colLabel}</th><th>Atenciones</th><th>Total consumido</th></tr></thead>`;
    const tbody = document.createElement('tbody');
    rows.forEach(([g,v])=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${escapeHtml(g)}</td><td>${v.count}</td><td style="font-weight:700;color:var(--teal);">${money(v.total)}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.innerHTML='';
    tableWrap.appendChild(table);

    const totalBar = document.createElement('div'); totalBar.className='total-bar'; totalBar.style.marginTop='14px';
    totalBar.innerHTML = `<span>Total general<br><span class="sub">${grandCount} atenciones registradas</span></span><span>${money(grandTotal)}</span>`;
    tableWrap.appendChild(totalBar);
  }
  loadAndRender();

  return wrap;
}

function renderPrecios(){
  const wrap = document.createElement('div');

  const addBox = document.createElement('div'); addBox.className='add-item-box';
  addBox.innerHTML = `<h3>➕ Agregar nuevo insumo o medicamento</h3>`;
  const addGrid = document.createElement('div'); addGrid.className='add-item-grid';
  const catNames = allCategoryNames();
  addGrid.innerHTML = `
    <div class="field">
      <label>Categoría</label>
      <select id="add-cat">
        ${catNames.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}
        <option value="__new__">+ Nueva categoría...</option>
      </select>
    </div>
    <div class="field">
      <label>Tipo</label>
      <select id="add-type">
        <option value="supply">Insumo (solo cantidad)</option>
        <option value="med">Medicamento (cantidad + indicación)</option>
      </select>
    </div>
    <div class="field">
      <label>Nombre del ítem</label>
      <input type="text" id="add-label" placeholder="Ej. Guantes talla 9">
    </div>
    <div class="field">
      <label>Detalle (opcional)</label>
      <input type="text" id="add-extra" placeholder="Ej. Tamaño ____">
    </div>
    <button class="btn-primary" id="add-btn">Agregar</button>
  `;
  addBox.appendChild(addGrid);
  const newCatRow = document.createElement('div'); newCatRow.className='new-cat-row'; newCatRow.style.display='none';
  newCatRow.innerHTML = `<input type="text" id="new-cat-name" placeholder="Nombre de la nueva categoría">`;
  addBox.appendChild(newCatRow);
  wrap.appendChild(addBox);

  const catSelect = addGrid.querySelector('#add-cat');
  const typeSelect = addGrid.querySelector('#add-type');

  function typeForCategory(name){
    const base = BASE_CATEGORIES.find(c=>c.name===name);
    if(base) return base.type;
    const cc = state.customCats.find(c=>c.name===name);
    if(cc) return cc.type;
    return null;
  }
  function updateTypeLock(){
    if(catSelect.value!=='__new__'){
      newCatRow.style.display='none';
      const t = typeForCategory(catSelect.value);
      if(t){ typeSelect.value = t; typeSelect.disabled = true; } else { typeSelect.disabled=false; }
    } else {
      newCatRow.style.display='flex';
      typeSelect.disabled = false;
    }
  }
  catSelect.onchange = updateTypeLock;
  updateTypeLock();

  addGrid.querySelector('#add-btn').onclick = async ()=>{
    const labelInp = addGrid.querySelector('#add-label');
    const extraInp = addGrid.querySelector('#add-extra');
    const label = labelInp.value.trim();
    if(!label){ showToast('Escribe el nombre del ítem'); return; }
    let catName = catSelect.value;
    const type = typeSelect.value;
    if(catName==='__new__'){
      catName = newCatRow.querySelector('#new-cat-name').value.trim();
      if(!catName){ showToast('Escribe el nombre de la nueva categoría'); return; }
      if(!state.customCats.find(c=>c.name===catName) && !BASE_CATEGORIES.find(c=>c.name===catName)){
        state.customCats.push({name:catName, type});
        await saveCustomCats(state.customCats);
      }
    }
    const newItem = { id: nowId('c'), catName, label, extra: extraInp.value.trim()||null, type };
    state.customItems.push(newItem);
    await saveCustomItems(state.customItems);
    showToast('Ítem agregado');
    render();
  };

  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>Insumos y medicamentos</h2><p class="note">Aquí defines el <b>precio de venta</b> que se cobra al paciente por cada insumo — esto es lo que ve Enfermería y Administración para calcular el total consumido. El médico nunca ve esta pantalla. Cuando existe, se muestra también el <b>último costo de compra</b> conocido como referencia (no es lo que se cobra). Puedes eliminar ítems que ya no se usen (el historial de atenciones pasadas no se altera).</p>`;

  const suggCount = Object.keys(SUGGESTED_SALE_PRICES).length;
  if(suggCount > 0){
    const suggBox = document.createElement('div');
    suggBox.style.cssText = 'background:#eafaf3;border:1px solid var(--green);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;';
    suggBox.innerHTML = `<span>💰 Hay <b>${suggCount}</b> precios de venta del inventario (15/10/2026). Ya se usan por defecto; este botón sirve para restablecer todos a esos valores.</span>`;
    const suggBtn = document.createElement('button'); suggBtn.className='btn-outline btn-sm'; suggBtn.textContent='Restablecer precios al inventario';
    suggBtn.onclick = async ()=>{
      if(!(await showConfirm('Esto llenará el precio de venta de '+suggCount+' ítems con el precio sugerido (costo + margen + ISV). Los precios que ya hayas definido a mano para esos mismos ítems se sobrescribirán. ¿Continuar?'))) return;
      Object.keys(SUGGESTED_SALE_PRICES).forEach(k=>{ state.precios[k] = SUGGESTED_SALE_PRICES[k]; });
      await savePrecios(state.precios);
      showToast('Precios de venta sugeridos cargados');
      render();
    };
    suggBox.appendChild(suggBtn);
    card.appendChild(suggBox);
  }

  const searchBar = document.createElement('div'); searchBar.className='search-bar';
  searchBar.innerHTML = `<input type="text" placeholder="Buscar insumo...">`;
  const input = searchBar.querySelector('input');
  card.appendChild(searchBar);

  const tableWrap = document.createElement('div'); tableWrap.style.maxHeight='60vh'; tableWrap.style.overflow='auto';
  const table = document.createElement('table'); table.className='price-table';
  table.innerHTML = `<thead><tr><th>Ítem</th><th>Categoría</th><th>Costo de compra (ref.)</th><th>Precio de venta (L.)</th><th></th></tr></thead>`;
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);

  const saveBar = document.createElement('div'); saveBar.style.marginTop='12px'; saveBar.style.textAlign='right';
  const saveBtn = document.createElement('button'); saveBtn.className='btn-primary'; saveBtn.textContent='Guardar precios';
  let dirty = {};
  saveBtn.onclick = async ()=>{
    Object.assign(state.precios, dirty);
    await savePrecios(state.precios);
    dirty = {};
    showToast('Precios guardados');
  };
  saveBar.appendChild(saveBtn);
  card.appendChild(saveBar);
  wrap.appendChild(card);

  function refresh(filter){
    tbody.innerHTML='';
    const effCats = buildEffectiveCategories();
    effCats.forEach(cat=>{
      const matching = cat.items.filter(it=> !filter || it.label.toLowerCase().includes(filter.toLowerCase()));
      if(matching.length===0) return;
      const catRow = document.createElement('tr'); catRow.className='cat-header-row';
      catRow.innerHTML = `<td colspan="4">${escapeHtml(cat.name)}${cat.isCustomCat?' (nueva)':''}</td>`;
      tbody.appendChild(catRow);
      matching.forEach(it=>{
        const k = it.key;
        const tr = document.createElement('tr');
        const cost = PURCHASE_COSTS[k];
        const suggested = SUGGESTED_SALE_PRICES[k];
        tr.innerHTML = `
          <td>${escapeHtml(it.label)}</td>
          <td style="color:var(--text-mut);font-size:11px;">${cat.type==='med'?'Medicamento':'Insumo'}</td>
          <td>${cost ? `<span class="price-tag" title="${escapeHtml(cost.source)}">L.${cost.cost.toFixed(2)}</span>` : '<span style="color:#c4ccd3;">—</span>'}</td>
          <td>
            <input type="number" step="0.01" min="0" class="price-input" value="${effPrice(k)||''}" placeholder="0.00">
            ${suggested!=null ? `<div style="font-size:10px;color:var(--green);margin-top:2px;">inventario: L.${suggested.toFixed(2)}</div>` : ''}
          </td>
          <td><button class="btn-icon" title="Eliminar ítem">🗑</button></td>
        `;
        tr.querySelector('input').oninput = (e)=>{ dirty[k] = e.target.value===''? 0 : Number(e.target.value); };
        tr.querySelector('button').onclick = async ()=>{
          if(!(await showConfirm('¿Eliminar "'+it.label+'"? Ya no aparecerá para nuevas atenciones, pero el historial existente no cambia.'))) return;
          state.deleted.push(k);
          await saveDeleted(state.deleted);
          showToast('Ítem eliminado');
          render();
        };
        tbody.appendChild(tr);
      });
    });
  }
  refresh('');
  input.oninput = ()=> refresh(input.value);

  return wrap;
}

render();

if(getApi() && !window.storage){ ensureConfig(); getIndex('atenciones'); getIndex('hospitalizaciones'); getAdminPass().catch(()=>{}); }
