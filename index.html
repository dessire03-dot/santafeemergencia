<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro de Insumos - Emergencia - Clínica Santa Fe</title>
<style>
  :root{
    --navy:#1F3B5C;
    --navy-dark:#152a44;
    --teal:#2f8f8a;
    --teal-light:#e8f4f3;
    --green:#3fae6a;
    --red:#c0392b;
    --amber:#c98a1f;
    --bg:#f5f7f9;
    --card:#ffffff;
    --border:#dbe2e8;
    --text:#1c2733;
    --text-mut:#6b7a89;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:14px;
  }
  .app{max-width:1100px;margin:0 auto;padding:16px 16px 80px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--navy); color:#fff; padding:10px 18px;border-radius:var(--radius);
    margin-bottom:16px; flex-wrap:wrap; gap:8px;
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .topbar .brand img{height:32px; border-radius:4px; background:#fff; padding:2px;}
  .topbar .brand .title{font-weight:700;font-size:15px;}
  .topbar .brand .role{font-size:11px; opacity:0.85; text-transform:uppercase; letter-spacing:0.04em;}
  .topbar .actions{display:flex;gap:8px;align-items:center;}
  button{
    font-family:inherit; cursor:pointer; border:none; border-radius:8px;
    padding:8px 14px; font-size:13px; font-weight:600; transition:opacity .15s, transform .05s;
  }
  button:active{transform:scale(0.98);}
  button:disabled{opacity:0.5; cursor:not-allowed;}
  .btn-primary{background:var(--teal); color:#fff;}
  .btn-primary:hover{opacity:0.9;}
  .btn-ghost{background:rgba(255,255,255,0.12); color:#fff;}
  .btn-ghost:hover{background:rgba(255,255,255,0.2);}
  .btn-outline{background:#fff; color:var(--navy); border:1px solid var(--border);}
  .btn-outline:hover{background:var(--teal-light);}
  .btn-danger{background:#fdecea; color:var(--red);}
  .btn-danger:hover{background:#fbdcd9;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn-icon{background:transparent; padding:4px 7px; font-size:14px; border-radius:6px;}
  .btn-icon:hover{background:#fdecea;}

  .role-select{display:flex; flex-direction:column; align-items:center; padding:60px 16px;}
  .role-select img{height:90px; margin-bottom:8px;}
  .role-select h1{font-size:20px; color:var(--navy); margin:4px 0 2px;}
  .role-select p{color:var(--text-mut); margin:0 0 32px;}
  .role-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; width:100%; max-width:820px;}
  @media (max-width:720px){.role-cards{grid-template-columns:1fr;}}
  .role-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:24px 18px; text-align:center; cursor:pointer; transition:.15s;
  }
  .role-card:hover{border-color:var(--teal); box-shadow:0 4px 14px rgba(47,143,138,0.15); transform:translateY(-2px);}
  .role-card .icon{font-size:32px; margin-bottom:10px;}
  .role-card h3{margin:0 0 6px; color:var(--navy); font-size:16px;}
  .role-card p{margin:0; color:var(--text-mut); font-size:12.5px; line-height:1.4;}

  .card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .card h2{margin:0 0 12px; font-size:16px; color:var(--navy);}

  .field-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  @media (max-width:700px){.field-grid{grid-template-columns:1fr 1fr;}}
  .field label{display:block; font-size:11.5px; font-weight:600; color:var(--text-mut); margin-bottom:3px; text-transform:uppercase; letter-spacing:.02em;}
  .field input, .field textarea, .field select{
    width:100%; padding:7px 9px; border:1px solid var(--border); border-radius:7px;
    font-size:13.5px; font-family:inherit; background:#fcfdfe;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--teal); outline-offset:0; border-color:var(--teal);}
  .field.span2{grid-column:span 2;}
  .field.span3{grid-column:span 3;}

  .search-bar{display:flex; gap:8px; margin-bottom:12px;}
  .search-bar input{flex:1; padding:9px 12px; border:1px solid var(--border); border-radius:8px; font-size:13.5px;}

  details.category{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    margin-bottom:8px; overflow:hidden;
  }
  details.category[open] summary{border-bottom:1px solid var(--border);}
  summary.cat-summary{
    padding:10px 14px; cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center;
    background:var(--navy); color:#fff; font-weight:700; font-size:12.5px; letter-spacing:.02em;
  }
  summary.cat-summary::-webkit-details-marker{display:none;}
  summary.cat-summary .badge{
    background:rgba(255,255,255,0.18); border-radius:20px; padding:2px 9px; font-size:11px; font-weight:600;
  }
  .cat-body{padding:8px;}
  .item-grid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px;}
  @media (max-width:800px){.item-grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:520px){.item-grid{grid-template-columns:1fr;}}
  .item-row{
    display:flex; align-items:flex-start; gap:6px; padding:6px 8px; border:1px solid var(--border);
    border-radius:7px; background:#fcfdfe;
  }
  .item-row.checked{background:var(--teal-light); border-color:var(--teal);}
  .item-row input[type=checkbox]{margin-top:2px; width:15px; height:15px; accent-color:var(--teal); flex-shrink:0;}
  .item-row .item-body{flex:1; min-width:0;}
  .item-row .item-label{font-size:12.5px; font-weight:600; line-height:1.3;}
  .item-row .item-extra{font-size:10.5px; color:var(--text-mut);}
  .item-row .qty-row{display:flex; gap:5px; margin-top:4px; flex-wrap:wrap;}
  .item-row input.veces{width:58px; padding:3px 5px; font-size:12px; border:1px solid var(--border); border-radius:5px;}
  .item-row input.veces:disabled{background:#f1f3f5; color:#aaa;}
  .item-row input.qty{width:52px; padding:3px 5px; font-size:12px; border:1px solid var(--border); border-radius:5px;}
  .item-row input.indic{flex:1; padding:3px 6px; font-size:12px; border:1px solid var(--border); border-radius:5px;}
  .item-row input.qty:disabled, .item-row input.indic:disabled{background:#f1f3f5; color:#aaa;}

  .price-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  .price-table th{text-align:left; background:var(--navy); color:#fff; padding:7px 10px; position:sticky; top:0;}
  .price-table td{padding:6px 10px; border-bottom:1px solid var(--border);}
  .price-table tr:hover{background:var(--teal-light);}
  .price-table input.price-input{width:90px; padding:4px 6px; border:1px solid var(--border); border-radius:6px; font-size:12.5px;}
  .cat-header-row td{background:#eef2f5; font-weight:700; color:var(--navy); font-size:11.5px; text-transform:uppercase;}

  .list-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:pointer;
  }
  .list-item:hover{border-color:var(--teal);}
  .list-item .li-main{display:flex; flex-direction:column; gap:2px;}
  .list-item .li-name{font-weight:700; color:var(--navy); font-size:14px;}
  .list-item .li-meta{font-size:11.5px; color:var(--text-mut);}
  .list-item .li-right{text-align:right; display:flex; flex-direction:column; gap:2px; align-items:flex-end;}
  .list-item .li-total{font-weight:700; color:var(--teal); font-size:14px;}
  .empty-state{text-align:center; padding:40px 20px; color:var(--text-mut);}

  .detail-header{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px 20px; margin-bottom:14px; font-size:13px;}
  @media (max-width:700px){.detail-header{grid-template-columns:1fr 1fr;}}
  .detail-header .dh-item .dh-label{font-size:10.5px; text-transform:uppercase; color:var(--text-mut); font-weight:700; letter-spacing:.03em;}
  .detail-header .dh-item .dh-value{font-size:13.5px; color:var(--text); font-weight:600;}

  .detail-cat{margin-bottom:14px;}
  .detail-cat h4{background:var(--navy); color:#fff; margin:0; padding:7px 12px; border-radius:8px 8px 0 0; font-size:12px; letter-spacing:.02em;}
  table.detail-table{width:100%; border-collapse:collapse; font-size:12.5px; border:1px solid var(--border); border-top:none;}
  table.detail-table th{text-align:left; background:#eef2f5; padding:6px 10px; font-size:11px; color:var(--text-mut); text-transform:uppercase;}
  table.detail-table td{padding:6px 10px; border-top:1px solid var(--border);}
  table.detail-table td.num{text-align:right; white-space:nowrap;}
  .total-bar{
    display:flex; justify-content:space-between; align-items:center; background:var(--navy); color:#fff;
    padding:14px 18px; border-radius:10px; margin-top:6px; font-size:15px; font-weight:700;
  }
  .total-bar .sub{font-size:11px; font-weight:500; opacity:0.8; text-transform:none;}

  .tabs{display:flex; gap:6px; margin-bottom:14px;}
  .tab-btn{background:#fff; border:1px solid var(--border); color:var(--text-mut);}
  .tab-btn.active{background:var(--navy); color:#fff; border-color:var(--navy);}

  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    background:var(--navy); color:#fff; padding:10px 20px; border-radius:30px; font-size:13px; font-weight:600;
    box-shadow:0 4px 16px rgba(0,0,0,0.25); z-index:999; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  .save-bar{
    position:sticky; bottom:0; background:var(--card); border-top:1px solid var(--border);
    padding:10px 14px; display:flex; justify-content:flex-end; gap:8px; margin:0 -16px; border-radius:0 0 var(--radius) var(--radius);
  }
  .note{font-size:11.5px; color:var(--text-mut); margin-top:2px;}
  .price-tag{font-size:10.5px; color:var(--amber); font-weight:700;}

  .add-item-box{border:1px dashed var(--teal); border-radius:10px; padding:12px; margin-bottom:14px; background:var(--teal-light);}
  .add-item-box h3{margin:0 0 8px; font-size:13px; color:var(--navy);}
  .add-item-grid{display:grid; grid-template-columns:1.3fr 1fr 1.6fr 1fr auto; gap:8px; align-items:end;}
  @media (max-width:820px){.add-item-grid{grid-template-columns:1fr 1fr;}}
  .add-item-grid .field label{font-size:10.5px;}

  .ord-pac{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .ord-pac-h{background:var(--navy);color:#fff;padding:8px 14px;font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;}
  .ord-card{padding:12px 14px;border-top:1px solid var(--border);}
  .ord-card.susp{background:#fdf3f2;}
  .ord-card.done{background:#f2faf5;}
  .ord-title{font-weight:700;font-size:14px;color:var(--navy);}
  .ord-meta{font-size:12px;color:var(--text-mut);margin-top:2px;line-height:1.5;}
  .ord-doses{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center;}
  .chip{border-radius:20px;padding:4px 10px;font-size:11.5px;font-weight:600;border:1px solid var(--border);background:#fff;color:var(--text-mut);}
  .chip.done{background:#e6f6ec;border-color:var(--green);color:#1e7a45;}
  .badge-st{display:inline-block;border-radius:20px;padding:2px 9px;font-size:10.5px;font-weight:700;margin-left:6px;}
  .badge-st.act{background:#fff4dc;color:var(--amber);} .badge-st.fin{background:#e6f6ec;color:#1e7a45;} .badge-st.sus{background:#fdecea;color:var(--red);}
  .warn-banner{background:#fff4dc;border:1px solid var(--amber);border-radius:8px;padding:8px 12px;font-size:12px;margin-bottom:12px;}
  .modal-ov{position:fixed;inset:0;background:rgba(20,30,40,0.45);z-index:1000;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;}
  .modal-box{background:#fff;border-radius:12px;padding:18px;max-width:560px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.25);margin-top:20px;}

  .qrow{display:flex;gap:6px;align-items:center;}
  .qrow input{flex:1;min-width:0;}
  .chips-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .chipbtn{border:1px solid var(--border);background:#fff;border-radius:20px;padding:4px 11px;font-size:12px;cursor:pointer;color:var(--navy);font-weight:600;}
  .chipbtn:hover{background:var(--teal-light);border-color:var(--teal);}
  @media print { body > *:not(#print-sheet){display:none !important;} #print-sheet{position:static !important;overflow:visible !important;} .no-print{display:none !important;} }
  .new-cat-row{display:flex; gap:6px; margin-top:6px;}
  .new-cat-row input{flex:1;}
</style>
</head>
<body>
<div id="root" class="app"></div>
<div id="toast" class="toast"></div>

// ---------- helpers ----------
function keyFor(catIdx, itemIdx){ return "b_"+catIdx+"_"+itemIdx; }
// Precio efectivo: el definido por Administración; si no hay, el del inventario (15/10/2026)
function effPrice(k){
  if(state.precios[k]!=null) return state.precios[k];
  return SUGGESTED_SALE_PRICES[k]!=null ? SUGGESTED_SALE_PRICES[k] : 0;
}
function money(n){
  n = Number(n)||0;
  return "L. " + n.toLocaleString('es-HN', {minimumFractionDigits:2, maximumFractionDigits:2});
}
function nowId(prefix){ return (prefix||'id') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=>t.classList.remove('show'), 2200);
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Confirmación con observación opcional (ej. "mano derecha")
function showApplyDialog(message, notaLabel){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,30,40,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:12px;padding:20px;max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.25);';
    box.innerHTML = `<div style="font-size:14px;line-height:1.5;margin-bottom:12px;">${escapeHtml(message)}</div>
      <div class="field" style="margin-bottom:14px;"><label>${escapeHtml(notaLabel)} (opcional)</label><input type="text" id="ap-nota" placeholder="Ej. mano derecha, antebrazo izquierdo..."></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;"><button class="btn-outline" id="ap-no">Cancelar</button><button class="btn-primary" id="ap-yes">Confirmar</button></div>`;
    overlay.appendChild(box); document.body.appendChild(overlay);
    const done = (v)=>{ document.body.removeChild(overlay); resolve(v); };
    box.querySelector('#ap-no').onclick = ()=>done(null);
    box.querySelector('#ap-yes').onclick = ()=>done({nota: box.querySelector('#ap-nota').value.trim()});
  });
}

// Custom in-app confirmation (native confirm()/alert() are unreliable inside sandboxed preview frames)
function showConfirm(message){
  return new Promise((resolve)=>{
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(20,30,40,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;';
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:12px;padding:20px;max-width:380px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.25);';
    box.innerHTML = `
      <div style="font-size:14px;color:var(--text);line-height:1.5;margin-bottom:16px;">${escapeHtml(message)}</div>
      <div style="display:flex;justify-content:flex-end;gap:8px;">
        <button class="btn-outline" id="confirm-no">Cancelar</button>
        <button class="btn-primary" id="confirm-yes">Confirmar</button>
      </div>
    `;
    overlay.appendChild(box);
    document.body.appendChild(overlay);
    const cleanup = (val)=>{ document.body.removeChild(overlay); resolve(val); };
    box.querySelector('#confirm-no').onclick = ()=>cleanup(false);
    box.querySelector('#confirm-yes').onclick = ()=>cleanup(true);
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup(false); });
  });
}

// ---------- storage adapter ----------
// Prioridad: 1) window.storage (vista previa de Claude)  2) Google Sheets vía Apps Script (GitHub Pages / cualquier navegador)
// 3) db de Artifacts publicados  4) memoria (solo esta sesión)
const memStore = {};
const recCache = {};
let _dbP = null;
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbyFpR3TgywzmlqQteJ1Pw8nJM2fMrAI5DhB9g-CST7dW41mPR_xKUWSj5L5vW8slemj/exec';
function getApi(){
  // La conexión que va dentro del archivo manda sobre cualquier copia vieja guardada en el navegador.
  try{
    const u = new URLSearchParams(location.search).get('api');
    if(u){ try{ localStorage.setItem('santafe_api', u); }catch(e){} return u; }
    if(DEFAULT_API) return DEFAULT_API;
    return localStorage.getItem('santafe_api') || '';
  }catch(e){ return DEFAULT_API; }
}
function setApi(u){ try{ if(u) localStorage.setItem('santafe_api', u); else localStorage.removeItem('santafe_api'); }catch(e){} }
async function remote(req){
  const r = await fetch(getApi(), { method:'POST', body: JSON.stringify(req) });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error||'error');
  return j;
}

async function getJSON(key, fallback, strict){
  let m = null;
  try{
    m = await storageMode();
    if(m==='storage'){
      const r = await window.storage.get(key, true);
      return r ? JSON.parse(r.value) : fallback;
    }
    if(m==='remote'){
      const j = await remote({op:'get', key:'kv/'+key});
      const val = j.v ? JSON.parse(j.v) : fallback;
      if(CFG_KEYS.indexOf(key)>=0) cSet(key, val);
      return val;
    }
    if(m==='db'){
      const db = await getDb();
      const snap = await db.doc('kv/'+key).get();
      return snap.exists ? JSON.parse(snap.data().v) : fallback;
    }
    return (key in memStore) ? JSON.parse(memStore[key]) : fallback;
  }catch(e){
    if(strict && (m==='remote' || m==='db')) throw e;
    return fallback;
  }
}
async function setJSON(key, val){
  try{
    const str = JSON.stringify(val);
    const m = await storageMode();
    if(m==='storage'){ await window.storage.set(key, str, true); return true; }
    if(m==='remote'){ await remote({op:'set', key:'kv/'+key, v:str}); if(CFG_KEYS.indexOf(key)>=0) cSet(key,val); return true; }
    if(m==='db'){ const db = await getDb(); await db.doc('kv/'+key).set({v:str}); return true; }
    memStore[key] = str; return true;
  }catch(e){
    showToast('⚠ No se pudo guardar. Revisa tu conexión a internet e inténtalo de nuevo.');

  }
}

async function bootBatch(){
  if(!(getApi() && !window.storage)) return null;
  try{
    const j = await remote({op:'multi', keys: CFG_KEYS.map(k=>'kv/'+k).concat(['kv/admin_password']), lists:['atenciones/']});
    if(!j.values) return null;
    const parse = (raw, fb)=> (raw===null || raw===undefined || raw==='') ? fb : JSON.parse(raw);
    const r = [parse(j.values['kv/precios'],{}), parse(j.values['kv/custom_items'],[]), parse(j.values['kv/custom_categories'],[]), parse(j.values['kv/deleted_keys'],[])];
    const before = JSON.stringify([state.precios,state.customItems,state.customCats,state.deleted]);
    CFG_KEYS.forEach((k,i)=> cSet(k, r[i]));
    state.precios=r[0]; state.customItems=r[1]; state.customCats=r[2]; state.deleted=r[3]; state.cfgOk = true;
    _passVal = parse(j.values['kv/admin_password'], null); _passKnown = true;

const _idxMemo = {};
async function getIndex(col){
  col = col || 'atenciones';
  const m = await storageMode();
  if(m==='remote'){
    if(col==='atenciones' && _cfgFresh && !_idxMemo[col]){ try{ await _cfgFresh; }catch(e){} }
    const memo = _idxMemo[col];
    if(memo && Date.now()-memo.t < 15000) return memo.p;
    const p = (async()=>{
      try{
        const j = await remote({op:'list', prefix: col+'/'});
        const out = [];
        (j.docs||[]).forEach(d=>{ try{ const r = JSON.parse(d.v); recCache[col+'/'+r.id]=r; out.push(summaryOf(r)); }catch(e){} });
        return out;
      }catch(e){ delete _idxMemo[col]; return []; }
    })();
    _idxMemo[col] = {t:Date.now(), p};
    return p;
  }
  if(m==='db'){
    try{
      const db = await getDb();
      const qs = await db.collection(col).limit(1000).get();
      const out = [];
      qs.docs.forEach(d=>{ if(d.exists){ const r = JSON.parse(d.data().v); recCache[col+'/'+r.id]=r; out.push(summaryOf(r)); } });
      return out;
    }catch(e){ return []; }
  }

      else { const db = await getDb(); const snap = await db.doc(col+'/'+id).get(); r = snap.exists ? JSON.parse(snap.data().v) : null; }
      if(r) recCache[col+'/'+id] = r;

}
async function saveAtencion(rec, col){
  col = col || 'atenciones';
  const m = await storageMode();
  if(m==='remote'){
    try{ await remote({op:'set', key: col+'/'+rec.id, v: JSON.stringify(rec)}); recCache[col+'/'+rec.id]=rec; delete _idxMemo[col]; return true; }
    catch(e){ showToast('⚠ No se pudo guardar. Revisa tu conexión a internet e inténtalo de nuevo.'); return false; }
  }
  if(m==='db'){
    try{ const db = await getDb(); await db.doc(col+'/'+rec.id).set({v: JSON.stringify(rec)}); recCache[col+'/'+rec.id]=rec; return true; }
    catch(e){ showToast('⚠ No se pudo guardar. Verifica que tengas permiso de Colaborador/Editor.'); return false; }
  }
  const ok = await setJSON(COLS[col].pre+rec.id, rec);
  let idx = await getIndex(col);

}

function buildEffectiveCategories(){
  const deletedSet = new Set(state.deleted);
  const cats = BASE_CATEGORIES.map((cat, catIdx)=>({
    name: cat.name, type: cat.type, isCustomCat:false,
    items: cat.items.map((it,i)=>({ key:keyFor(catIdx,i), label:it.label, extra:it.extra })).filter(o=>!deletedSet.has(o.key)),
  }));
  state.customItems.forEach(ci=>{
    if(deletedSet.has(ci.id)) return;
    let cat = cats.find(c=>c.name===ci.catName);
    if(cat) cat.items.push({key:ci.id, label:ci.label, extra:ci.extra||null});
  });
  state.customCats.forEach(cc=>{
    const items = state.customItems.filter(ci=>ci.catName===cc.name && !deletedSet.has(ci.id))
      .map(ci=>({key:ci.id, label:ci.label, extra:ci.extra||null}));
    if(!cats.find(c=>c.name===cc.name)){
      cats.push({name:cc.name, type:cc.type, isCustomCat:true, items});
    }
  });
  return cats.filter(c=>c.items.length>0 || c.isCustomCat);
}

  }

  `;
  wrap.querySelector('#auth-cancel').onclick = ()=>{ state.authScreen=null; state.authError=''; render(); };
  const submit = async ()=>{
    const p1 = wrap.querySelector('#auth-p1').value;
    if(isSetup){
      const p2 = wrap.querySelector('#auth-p2').value;
      if(!p1 || p1.length<4){ state.authError='Usa al menos 4 caracteres.'; render(); return; }

function buildChecklist(itemsObj, onChange){
  const outer = document.createElement('div');
  const effCats = buildEffectiveCategories();
  const searchCard = document.createElement('div'); searchCard.className='card';
  searchCard.style.padding='10px 16px';
  searchCard.innerHTML = `<input type="text" placeholder="🔎 Buscar insumo o medicamento..." style="width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13.5px;"><div class="note" style="margin-top:6px;">💊🔧 Los <b>medicamentos</b> y <b>procedimientos</b> que marques pasan solos a <b>Órdenes</b> de Enfermería. <b>Cant.</b> = cuántas unidades (2 ampollas, 2 yesos): Enfermería las marca <b>una por una</b> y queda quién hizo cada una. En "Veces" pon otro número solo si es distinto de Cant.; <b>0</b> = solo registro, ya se hizo.</div>`;
  const searchInput = searchCard.querySelector('input');
  outer.appendChild(searchCard);

  const catsBox = document.createElement('div');
  outer.appendChild(catsBox);

  function itemMatches(label, filter){
    return !filter || label.toLowerCase().includes(filter.toLowerCase());
  }

  function renderCategories(filter){
    catsBox.innerHTML='';
    effCats.forEach(cat=>{
      const matchingItems = cat.items.filter(it=>itemMatches(it.label, filter));
      if(filter && matchingItems.length===0) return;
      const checkedCount = cat.items.reduce((n,it)=> n + (itemsObj[it.key]?.checked?1:0), 0);
      const det = document.createElement('details'); det.className='category';
      if(filter) det.open = true;
      const summary = document.createElement('summary'); summary.className='cat-summary';
      summary.innerHTML = `<span>${escapeHtml(cat.name)}${cat.type==='med'?' 💊':(cat.type==='proc'?' 🔧':'')}</span><span class="badge">${checkedCount>0? checkedCount+' marcados · ':''}${cat.items.length} ítems</span>`;
      det.appendChild(summary);
      const fillBody = ()=>{
      const body = document.createElement('div'); body.className='cat-body';
      const grid = document.createElement('div'); grid.className='item-grid';
      const fullList = filter ? matchingItems : cat.items;
      const list = fullList.slice(0, 150);
      list.forEach(it=>{
        const k = it.key;
        const cur = itemsObj[k] || {checked:false, cantidad:'', indicacion:''};
        const row = document.createElement('div'); row.className='item-row'+(cur.checked?' checked':'');
        row.innerHTML = `
          <input type="checkbox" ${cur.checked?'checked':''}>
          <div class="item-body">
            <div class="item-label">${escapeHtml(it.label)}</div>
            ${it.extra?`<div class="item-extra">${escapeHtml(it.extra)}</div>`:''}
            <div class="qty-row">
              <input type="text" class="qty" placeholder="Cant." value="${escapeHtml(cur.cantidad)}" ${cur.checked?'':'disabled'}>
              ${isTask(cat.type) ? `<input type="text" class="indic" placeholder="${cat.type==='proc'?'Indicación (zona, lado, detalle)':'Indicación (dosis, vía, dilución)'}" value="${escapeHtml(cur.indicacion)}" ${cur.checked?'':'disabled'}>` : ''}
              ${isTask(cat.type) ? `<input type="number" min="0" max="30" class="veces" placeholder="Veces" title="Cuántas veces o unidades deben realizarse. 0 = solo registro (ya se hizo)" value="${cur.veces===undefined?'':escapeHtml(String(cur.veces))}" ${cur.checked?'':'disabled'}>` : ''}
            </div>
          </div>
        `;
        const cb = row.querySelector('input[type=checkbox]');
        const qtyInp = row.querySelector('input.qty');
        const indicInp = row.querySelector('input.indic');
        const vecesInp = row.querySelector('input.veces');
        cb.onchange = ()=>{
          const nowChecked = cb.checked;
          if(!itemsObj[k]) itemsObj[k] = {checked:false, cantidad:'', indicacion:''};
          itemsObj[k].checked = nowChecked;
          row.classList.toggle('checked', nowChecked);
          qtyInp.disabled = !nowChecked;
          if(indicInp) indicInp.disabled = !nowChecked;
          if(vecesInp) vecesInp.disabled = !nowChecked;
          if(nowChecked) qtyInp.focus();
          if(onChange) onChange(k);
        };
        qtyInp.oninput = ()=>{ itemsObj[k].cantidad = qtyInp.value; if(onChange) onChange(k); };
        if(indicInp) indicInp.oninput = ()=>{ itemsObj[k].indicacion = indicInp.value; if(onChange) onChange(k); };
        if(vecesInp) vecesInp.oninput = ()=>{ itemsObj[k].veces = vecesInp.value; if(onChange) onChange(k); };
        grid.appendChild(row);
      });
      body.appendChild(grid);
      if(fullList.length>list.length){ const more=document.createElement('div'); more.className='note'; more.style.padding='6px'; more.textContent='… y '+(fullList.length-list.length)+' más. Escribe más letras en el buscador para verlos.'; body.appendChild(more); }
      det.appendChild(body);
      };
      // Solo se dibujan los ítems de una categoría cuando se abre (la página abre mucho más rápido)
      if(filter){ fillBody(); } else { det.addEventListener('toggle', ()=>{ if(det.open && !det._filled){ det._filled = true; fillBody(); } }); }
      catsBox.appendChild(det);
    });
  }
  renderCategories('');
  let _sT = null;
  searchInput.oninput = ()=>{ clearTimeout(_sT); _sT = setTimeout(()=>{ const q = searchInput.value.trim(); renderCategories(q.length>=2 ? q : ''); }, 250); };
  return outer;
}

function computeTotal(rec){
  const map = buildAllItemsMap();
  let total = 0;
  const byCatName = {};
  Object.keys(rec.items||{}).forEach(k=>{
    const cur = rec.items[k];
    if(!cur || !cur.checked) return;
    const info = map[k];
    if(!info) return;
    const price = Number(effPrice(k))||0;
    const qty = Number(cur.cantidad)||0;
    const subtotal = price * (qty||1);
    total += subtotal;
    if(!byCatName[info.catName]) byCatName[info.catName] = {name:info.catName, type:info.type, rows:[]};
    byCatName[info.catName].rows.push({label:info.label, extra:info.extra, cantidad:cur.cantidad, indicacion:cur.indicacion, price, subtotal});
  });
  return {total, byCat: Object.values(byCatName)};
}

function renderStaffList(){
  const wrap = document.createElement('div');
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>Atenciones registradas</h2><p class="note">Selecciona un paciente para ver el detalle marcado por el médico, indicaciones y el total consumido.</p>`;
  const searchBar = document.createElement('div'); searchBar.className='search-bar';
  searchBar.innerHTML = `<input type="text" placeholder="Buscar por nombre de paciente...">`;
  const input = searchBar.querySelector('input'); input.value = state.filterText;
  input.oninput = ()=>{ state.filterText = input.value; refresh(); };
  card.appendChild(searchBar);
  const listBox = document.createElement('div'); card.appendChild(listBox);
  wrap.appendChild(card);

  let idxLoaded = false;
  async function refresh(){
    if(!idxLoaded){
      idxLoaded = true;
      if(state.index.length){            // ya hay datos en memoria: se muestran al instante y se actualizan después
        getIndex().then(ix=>{ if(JSON.stringify(ix.map(x=>[x.id,x.updatedAt]))!==JSON.stringify(state.index.map(x=>[x.id,x.updatedAt]))){ state.index = ix; draw(); } else state.index = ix; });
      } else {
        listBox.innerHTML = '<div class="empty-state">Cargando...</div>';
        state.index = await getIndex();
      }
    }
    return draw();
  }
  let drawSeq = 0;
  async function draw(){
    const my = ++drawSeq;
    const items = state.index.filter(x=>x.nombre.toLowerCase().includes(state.filterText.toLowerCase()));
    items.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
    if(items.length===0){ listBox.innerHTML = `<div class="empty-state">No hay atenciones registradas todavía.</div>`; return; }
    listBox.innerHTML='';
    const refs = [];
    for(const it of items){
      const rec = await getAtencion(it.id);
      if(my!==drawSeq) return;
      const row = document.createElement('div'); row.className='list-item';
      let totalStr = '';
      if(rec){ const {total} = computeTotal(rec); totalStr = money(total); }
      row.innerHTML = `
        <div class="li-main">
          <div class="li-name">${escapeHtml(it.nombre)}</div>
          <div class="li-meta">${escapeHtml(fmtFecha(it.fecha))} ${it.medico? '· '+escapeHtml(drName(it.medico)):''}</div>
        </div>
        <div class="li-right">
          <div class="li-total">${totalStr}</div>
          <div class="ord-slot"><div class="li-meta">💊 revisando…</div></div>
          <div class="li-meta">Ver detalle →</div>
        </div>
      `;
      row.onclick = ()=>{ state.currentId = it.id; state.view='detail'; render(); };
      listBox.appendChild(row);
      refs.push({id:it.id, nombre:it.nombre, slot:row.querySelector('.ord-slot')});
    }
    if(my===drawSeq) attachOrderBadges(refs);
  }
  refresh();
  return wrap;
}

function todayISO(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate()); }
function emptyHosp(){
  return { id: nowId('hp'), nombre:'', edad:'', cama:'', fechaIngreso: todayISO(), medico:'', diagnostico:'',
           estado:'hospitalizado', fechaAlta:'', days:{}, ords:{}, createdAt:Date.now(), updatedAt:Date.now() };
}
function stayTotals(rec){
  const perDay = Object.keys(rec.days||{}).sort().map(day=>{
    const r = computeTotal({items: rec.days[day].items||{}});
    return {day, total:r.total, byCat:r.byCat, n:r.byCat.reduce((n,c)=>n+c.rows.length,0)};
  });
  return {perDay, total: perDay.reduce((n,d)=>n+d.total,0)};
}

async function collectBackup(){
  const out = { app:'registro-insumos-santafe', version:1, fecha:new Date().toISOString(),
    precios: await getPrecios(), custom_items: await getCustomItems(), custom_categories: await getCustomCats(), deleted_keys: await getDeleted(),
    atenciones:[], hospitalizaciones:[] };
  for(const col of ['atenciones','hospitalizaciones']){
    const idx = await getIndex(col);
    for(const it of idx){ const r = await getAtencion(it.id, col, true); if(r) out[col].push(r); }
  }
  return out;
}
async function downloadFile(filename, text){
  try{
    if(window.claude && window.claude.use){
      const dl = await window.claude.use('downloads');
      if(dl){ await dl.save({filename, data:text}); return; }
    }
  }catch(e){ return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}

  const wrap = document.createElement('div');

  const row = document.createElement('div'); row.style.cssText='display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;align-items:center;';

    if(data.app!=='registro-insumos-santafe'){ showToast('El archivo no es un respaldo de esta app'); return; }
    if(!(await showConfirm(`Se restaurarán ${data.atenciones.length} atenciones, ${data.hospitalizaciones.length} hospitalizados y los precios del respaldo del ${data.fecha.slice(0,10)}. Lo que coincida se sobrescribirá. ¿Continuar?`))) return;
    await savePrecios(data.precios||{}); await saveCustomItems(data.custom_items||[]); await saveCustomCats(data.custom_categories||[]); await saveDeleted(data.deleted_keys||[]);
    for(const r of data.atenciones||[]) await saveAtencion(r,'atenciones');

    state.precios = data.precios||{}; state.customItems = data.custom_items||[]; state.customCats = data.custom_categories||[]; state.deleted = data.deleted_keys||[];
    state.index = await getIndex();
    showToast('Respaldo restaurado'); file.value='';
  };
  row.appendChild(dlBtn); row.appendChild(upBtn); row.appendChild(file);

const ORD = 'ordenes', APL = 'aplicaciones';
function parseDocs(arr){ return (arr||[]).map(d=>{ try{ return JSON.parse(d.v); }catch(e){ return null; } }).filter(Boolean); }
async function colList(col){
  const m = await storageMode();
  if(m==='remote'){ const j = await remote({op:'list', prefix: col+'/'}); return parseDocs(j.docs); }
  if(m==='db'){ const db = await getDb(); const qs = await db.collection(col).limit(1000).get(); return qs.docs.filter(d=>d.exists).map(d=>JSON.parse(d.data().v)); }
  return Object.values(await getJSON('col_'+col, {}));
}
async function colGet(col, id){
  const m = await storageMode();
  if(m==='remote'){ const j = await remote({op:'get', key: col+'/'+id}); return j.v ? JSON.parse(j.v) : null; }
  if(m==='db'){ const db = await getDb(); const snap = await db.doc(col+'/'+id).get(); return snap.exists ? JSON.parse(snap.data().v) : null; }
  return (await getJSON('col_'+col, {}))[id] || null;
}
async function colSet(col, id, rec){
  const m = await storageMode();
  if(m==='remote'){ await remote({op:'set', key: col+'/'+id, v: JSON.stringify(rec)}); return; }
  if(m==='db'){ const db = await getDb(); await db.doc(col+'/'+id).set({v: JSON.stringify(rec)}); return; }
  const all = await getJSON('col_'+col, {}); all[id] = rec; await setJSON('col_'+col, all);
}
// Guarda SOLO si no existe. Devuelve {created:true} o {created:false, rec:existente}
async function colClaim(col, id, rec){
  const m = await storageMode();
  if(m==='remote'){
    try{
      const j = await remote({op:'setnx', key: col+'/'+id, v: JSON.stringify(rec)});
      return j.created ? {created:true} : {created:false, rec: j.v ? JSON.parse(j.v) : null};
    }catch(e){
      if(String(e.message).indexOf('desconocida')<0) throw e;
      state.noSetnx = true;   // Apps Script antiguo: protección parcial
    }
  }
  const ex = await colGet(col, id);
  if(ex) return {created:false, rec:ex};
  await colSet(col, id, rec);
  return {created:true};
}
async function loadOrdenes(){
  const m = await storageMode(); let orders = null, apps = null;
  if(m==='remote'){
    try{
      const j = await remote({op:'multi', keys:[], lists:['ordenes/','aplicaciones/']});
      if(j.lists){ orders = parseDocs(j.lists['ordenes/']); apps = parseDocs(j.lists['aplicaciones/']); }
    }catch(e){}
  }
  if(!orders){ orders = await colList(ORD); apps = await colList(APL); }

}

async function colSetMany(col, recs){
  if(!recs.length) return;
  const m = await storageMode();
  if(m==='remote'){
    try{ await remote({op:'mset', items: recs.map(r=>({key: col+'/'+r.id, v: JSON.stringify(r.rec)}))}); return; }
    catch(e){ if(String(e.message).indexOf('desconocida')<0) throw e; }

function detectVia(txt){
  const t = ' '+(txt||'')+' ';
  if(/\b(IV|EV)\b|endoven|intraven/i.test(t)) return 'IV';
  if(/\bIM\b|intramusc/i.test(t)) return 'IM';
  if(/\b(SC|SQ)\b|subcut/i.test(t)) return 'SC';
  if(/\bVO\b|\boral\b|\bv\.o\b/i.test(t)) return 'VO';
  if(/\bSL\b|sublingual/i.test(t)) return 'SL';
  return '';
}
// jobs: [{rec, items, scope, extra:{tipo,fecha}}]
// 1) Qué órdenes debe tener cada job según lo marcado por el médico
function desiredFor(job){
  const map = buildAllItemsMap(); const {rec, items, scope, extra} = job; const desired = {};
  Object.keys(items||{}).forEach(k=>{
    const it = items[k]; if(!it || !it.checked) return;
    const info = map[k]; if(!info || !isTask(info.type)) return;
    let veces;
    if(it.veces!==undefined && it.veces!==null && it.veces!=='') veces = parseInt(it.veces,10);
    else { const mq = /^\s*(\d+)/.exec(it.cantidad||''); veces = mq ? Math.max(1, parseInt(mq[1],10)) : 1; }   // "2" o "2 ampollas" => 2 unidades
    if(!(veces>=1)) return;                       // 0 = solo registro
    const id = scope+k;
    desired[id] = { id, paciente: rec.nombre, cama: rec.cama||'', medicamento: info.label, tipoOrden: info.type==='proc' ? 'procedimiento' : 'medicamento',
      dosis:'', cantidad: it.cantidad||'', via: info.type==='med' ? detectVia(it.indicacion) : '', dilucion:'', frecuencia:'',
      dosisTotal: Math.min(veces,30), medico: rec.medico||'', indicaciones: it.indicacion||'',
      fuente:{tipo:extra.tipo, id:rec.id, scope, key:k}, fechaOrden: extra.fecha||'' };
  });
  return desired;
}
// 2) Qué hay que escribir comparando con las órdenes que ya existen
function diffOrders(jobs, desiredList, orders, apps){
  const toWrite = []; let created = 0;
  jobs.forEach((job,ji)=>{
    const desired = desiredList[ji]; const scope = job.scope;
    const mine = orders.filter(o=>o.fuente && o.fuente.scope===scope);
    Object.keys(desired).forEach(id=>{
      const d = desired[id]; const ex = mine.find(o=>o.id===id);
      const nApl = apps.filter(a=>a.orderId===id).length;
      if(ex){
        const upd = Object.assign({}, ex, {paciente:d.paciente, cama:d.cama, medicamento:d.medicamento, tipoOrden:d.tipoOrden, cantidad:d.cantidad, via:d.via||ex.via||'',
          indicaciones:d.indicaciones, medico:d.medico, dosisTotal: Math.max(d.dosisTotal, nApl)});
        if(ex.estado==='suspendida' && ex.retirada){ upd.estado='activa'; delete upd.retirada; }
        if(JSON.stringify(upd)!==JSON.stringify(ex)) toWrite.push({id, rec:upd});
      } else { toWrite.push({id, rec:Object.assign({}, d, {estado:'activa', createdAt:Date.now()})}); created++; }
    });
    mine.forEach(o=>{
      if(desired[o.id] || o.estado==='suspendida') return;
      const nApl = apps.filter(a=>a.orderId===o.id).length;
      if(nApl < (o.dosisTotal||1)) toWrite.push({id:o.id, rec:Object.assign({}, o, {estado:'suspendida', retirada:true})});
    });
  });
  return {toWrite, created, changed: toWrite.length};
}
async function syncOrders(jobs){
  const des = jobs.map(desiredFor);
  const {orders, apps} = await loadOrdenes();
  const r = diffOrders(jobs, des, orders, apps);
  await colSetMany(ORD, r.toWrite);
  return r;
}
// Guardado rápido: guarda el registro y lee las órdenes EN PARALELO; solo lee si ya había órdenes de este registro
async function saveWithOrders(saveFn, jobs){
  const des = jobs.map(desiredFor);
  let needRead = false;
  jobs.forEach((job,ji)=>{
    const rec = job.rec;
    const known = rec.ords && rec.ords[job.scope];
    if(rec.ords===undefined || (known && known.length)) needRead = true;   // registro anterior a esta función, o ya tenía órdenes
    rec.ords = rec.ords || {}; rec.ords[job.scope] = Object.keys(des[ji]);
  });
  const [ok, data] = await Promise.all([ saveFn(), needRead ? loadOrdenes() : Promise.resolve(null) ]);
  if(!ok) return {ok:false};
  const r = diffOrders(jobs, des, data?data.orders:[], data?data.apps:[]);
  await colSetMany(ORD, r.toWrite);
  return {ok:true, changed:r.changed, created:r.created};
}

// Revisa atenciones recientes y hospitalizados activos y crea las órdenes que falten
async function backfillOrders(){
  const jobs = []; const cutoff = Date.now() - 3*24*3600*1000; const today = todayISO();
  const idxA = await getIndex('atenciones');
  for(const it of idxA){
    if((it.updatedAt||0) < cutoff) continue;
    const rec = await getAtencion(it.id,'atenciones'); if(!rec) continue;
    jobs.push({rec, items:rec.items, scope:'em_'+rec.id+'_', extra:{tipo:'emergencia', fecha:rec.fecha}});
  }
  const idxH = await getIndex('hospitalizaciones');
  for(const it of idxH){
    if(it.estado==='alta') continue;
    const rec = await getAtencion(it.id,'hospitalizaciones'); if(!rec || !rec.days || !rec.days[today]) continue;
    jobs.push({rec, items:rec.days[today].items, scope:'hp_'+rec.id+'_'+today+'_', extra:{tipo:'hosp', fecha:today}});
  }
  if(!jobs.length) return {created:0, changed:0, revisadas:0};
  const r = await syncOrders(jobs); r.revisadas = jobs.length; return r;
}

function knownPatients(extra){
  const set = new Set();
  (state.index||[]).forEach(x=>x.nombre && set.add(x.nombre)); (state.hospIndex||[]).forEach(x=>x.nombre && set.add(x.nombre));
  (state._ordCache||[]).forEach(x=>x.paciente && set.add(x.paciente)); (extra||[]).forEach(x=>x && set.add(x));
  return [...set];
}
function regCsv(reg, recs){
  const cols = reg.campos.map(c=>c.l.replace(' *','')).concat(['Llenó','Fecha de registro','Editó','Fecha de edición']);
  const esc = (v)=> '"'+String(v===undefined||v===null?'':v).replace(/"/g,'""')+'"';
  const lines = [cols.map(esc).join(',')];
  recs.forEach(r=>{
    lines.push(reg.campos.map(c=> c.t==='check' ? (r[c.k]?'Sí':'No') : r[c.k]).concat([r.creadoPor, r.creadoEn?fechaHora(r.creadoEn):'', r.editadoPor||'', r.editadoEn?fechaHora(r.editadoEn):'']).map(esc).join(','));
  });
  return '\ufeff'+lines.join('\r\n');
}
function renderRegistros(){
  const wrap = document.createElement('div');
  if(!state.reg){
    const card = document.createElement('div'); card.className='card';
    card.innerHTML = `<h2>📋 Registros de la clínica</h2><p class="note">Elige un registro. En todos se guarda <b>quién lo llenó</b>, la fecha y la hora, y quién lo editó después.</p>`;
    const grid = document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:12px;';
    REGISTROS.forEach(r=>{
      const b = document.createElement('button'); b.className='btn-outline'; b.style.cssText='text-align:left;padding:14px;font-size:14px;';
      b.innerHTML = `<div style="font-size:22px;">${r.icon}</div><div style="font-weight:700;color:var(--navy);margin-top:4px;">${escapeHtml(r.titulo)}</div>`;
      b.onclick = ()=>{ state.reg = r.id; render(); }; grid.appendChild(b);
    });
    card.appendChild(grid); wrap.appendChild(card); return wrap;
  }
  const reg = REGISTROS.find(r=>r.id===state.reg); const col = 'reg_'+reg.id;
  let recs = []; let loaded = false; let filter = ''; let estado = 'todos';
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>${reg.icon} ${escapeHtml(reg.titulo)}</h2>`;
  const bar = document.createElement('div'); bar.className='search-bar';
  const back = document.createElement('button'); back.className='btn-outline'; back.textContent='← Registros'; back.onclick = ()=>{ state.reg=null; render(); };
  bar.innerHTML = `<input type="text" placeholder="Buscar...">`;
  bar.querySelector('input').oninput = (e)=>{ filter = e.target.value.toLowerCase(); draw(); };
  const nb = document.createElement('button'); nb.className='btn-primary'; nb.textContent='+ Nuevo registro'; nb.onclick = ()=> openForm(null);
  const xb = document.createElement('button'); xb.className='btn-outline'; xb.textContent='⬇ Exportar a Excel'; xb.onclick = ()=>{
    const blob = new Blob([regCsv(reg, recs.filter(r=>!r.anulado))], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = reg.id+'_'+todayISO()+'.csv'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
  };
  bar.insertBefore(back, bar.firstChild); bar.appendChild(nb); bar.appendChild(xb); card.appendChild(bar);
  if(reg.pend && reg.pend.length){
    const sel = document.createElement('select'); sel.style.cssText='padding:7px 9px;border:1px solid var(--border);border-radius:7px;margin-bottom:8px;';
    sel.innerHTML = `<option value="todos">Todos</option><option value="pend">⏳ Con pendientes</option><option value="ok">✔ Completos</option>`;
    sel.onchange = ()=>{ estado = sel.value; draw(); }; card.appendChild(sel);
  }
  wrap.appendChild(card);
  const box = document.createElement('div'); wrap.appendChild(box);
  const missing = (r)=> (reg.pend||[]).filter(k=>!r[k]).map(k=>reg.campos.find(c=>c.k===k).l);
  function sub(r){
    return reg.lista.sub.map(k=>{
      if(k==='dias_txt') return r.dias ? r.dias+' día(s)' : '';
      if(k==='num_txt') return r.num ? 'N.º '+r.num : '';
      if(k==='vitales_txt') return [r.pa?'PA '+r.pa:'', r.fc?'FC '+r.fc:'', r.fr?'FR '+r.fr:'', r.temp?'T '+r.temp+'°':'', r.sat?'Sat '+r.sat+'%':'', r.gluc?'Gluc '+r.gluc:''].filter(Boolean).join(' · ');
      if(k==='cantidad_txt') return r.cantidad ? 'Cant. '+r.cantidad : '';
      return /^(fecha|f_ingreso)$/.test(k) ? fmtFecha(r[k]) : r[k];
    }).filter(Boolean).join(' · ');
  }
  function draw(){
    if(!loaded){ box.innerHTML = '<div class="empty-state">Cargando...</div>'; return; }
    let list = recs.filter(r=>!r.anulado);
    if(filter) list = list.filter(r=> JSON.stringify(r).toLowerCase().includes(filter));
    if(estado==='pend') list = list.filter(r=>missing(r).length); if(estado==='ok') list = list.filter(r=>!missing(r).length);
    list.sort((a,b)=>(b.creadoEn||0)-(a.creadoEn||0));
    if(!list.length){ box.innerHTML = '<div class="empty-state">No hay registros todavía.</div>'; return; }
    box.innerHTML = '';
    list.forEach(r=>{
      const row = document.createElement('div'); row.className='list-item'; const miss = missing(r);
      row.innerHTML = `<div class="li-main"><div class="li-name">${escapeHtml(r[reg.lista.titulo]||'(sin nombre)')}</div>
        <div class="li-meta">${escapeHtml(sub(r))}</div>
        <div class="li-meta">Llenó: <b>${escapeHtml(r.creadoPor||'—')}</b> · ${fechaHora(r.creadoEn)}${r.editadoPor?' · Editó: '+escapeHtml(r.editadoPor)+' ('+fechaHora(r.editadoEn)+')':''}</div></div>
        <div class="li-right">${(reg.pend&&reg.pend.length)?(miss.length?`<span class="badge-st act">⏳ Falta: ${escapeHtml(miss.join(', '))}</span>`:'<span class="badge-st fin">✔ Completo</span>'):''}</div>`;
      row.onclick = ()=> openForm(r); box.appendChild(row);
    });
  }
  async function refresh(){
    try{ recs = await colList(col); loaded = true; }catch(e){ if(!loaded){ box.innerHTML = '<div class="empty-state">No se pudieron cargar los registros. Revisa tu conexión.</div>'; return; } }
    draw();
  }
  function openForm(rec){
    const v = rec ? Object.assign({}, rec) : {};
    reg.campos.forEach(c=>{ if(v[c.k]===undefined){ v[c.k] = c.t==='check' ? false : (c.def==='hoy' ? todayISO() : c.def==='ahora' ? nowHHMM() : ''); } });
    const ov = document.createElement('div'); ov.className='modal-ov';
    const box2 = document.createElement('div'); box2.className='modal-box'; box2.style.maxWidth='680px';
    box2.innerHTML = `<h2 style="margin:0 0 4px;color:var(--navy);font-size:16px;">${reg.icon} ${escapeHtml(reg.titulo)}</h2>
      <div class="note" style="margin-bottom:10px;">${rec?'Editando · llenó '+escapeHtml(rec.creadoPor||'—')+' el '+fechaHora(rec.creadoEn):'Nuevo registro'}</div>`;
    const grid = document.createElement('div'); grid.className='field-grid'; box2.appendChild(grid);
    const dl = document.createElement('datalist'); dl.id='dl-reg-pac'; dl.innerHTML = knownPatients(recs.map(r=>r.paciente)).map(n=>`<option value="${escapeHtml(n)}">`).join(''); box2.appendChild(dl);
    reg.campos.forEach(c=>{
      const cls = c.span===3?'span3':(c.span===2?'span2':''); let f;
      const set = (val)=>{ v[c.k]=val; };
      if(c.t==='date' || c.t==='time') f = dateTimeField(c.l, c.t, v[c.k], set, cls);
      else if(c.medico) f = doctorField(c.l, v[c.k], set, cls);
      else {
        f = document.createElement('div'); f.className='field '+cls;
        if(c.t==='check'){
          f.innerHTML = `<label style="display:flex;gap:8px;align-items:center;text-transform:none;font-size:13px;margin-top:18px;"><input type="checkbox" ${v[c.k]?'checked':''}> ${escapeHtml(c.l)}</label>`;
          f.querySelector('input').onchange = (e)=> set(e.target.checked);
        } else if(c.t==='select'){
          f.innerHTML = `<label>${escapeHtml(c.l)}</label><select><option value=""></option>${c.op.map(o=>`<option ${v[c.k]===o?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select>`;
          f.querySelector('select').onchange = (e)=> set(e.target.value);
        } else if(c.t==='textarea'){
          f.innerHTML = `<label>${escapeHtml(c.l)}</label><textarea rows="2" style="width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;">${escapeHtml(v[c.k]||'')}</textarea>`;
          f.querySelector('textarea').oninput = (e)=> set(e.target.value);
        } else {
          f.innerHTML = `<label>${escapeHtml(c.l)}</label><input type="${c.t==='number'?'number':'text'}" ${c.paciente?'list="dl-reg-pac" autocomplete="off"':''} value="${escapeHtml(v[c.k]===undefined?'':String(v[c.k]))}">`;
          f.querySelector('input').oninput = (e)=> set(e.target.value);
        }
      }
      grid.appendChild(f);
    });
    const who = document.createElement('div'); who.className='field'; who.style.cssText='margin-top:12px;max-width:340px;';
    who.innerHTML = `<label>Quién registra (tu nombre) *</label><input type="text" id="reg-who" value="${escapeHtml(lsGet('santafe_operador'))}" placeholder="Ej. Lic. Sofía">`;
    box2.appendChild(who);
    const err = document.createElement('div'); err.style.cssText='color:var(--red);font-size:12px;min-height:16px;margin:8px 0;'; box2.appendChild(err);
    const btns = document.createElement('div'); btns.style.cssText='display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;';
    const cancel = document.createElement('button'); cancel.className='btn-outline'; cancel.textContent='Cancelar'; cancel.onclick = ()=> ov.remove();
    const save = document.createElement('button'); save.className='btn-primary'; save.textContent='Guardar';
    if(rec && state.role==='admin'){
      const an = document.createElement('button'); an.className='btn-danger'; an.textContent='Anular registro';
      an.onclick = async ()=>{ if(!(await showConfirm('¿Anular este registro? Dejará de mostrarse en la lista.'))) return;
        try{ await colSet(col, rec.id, Object.assign({}, rec, {anulado:true, editadoPor:(who.querySelector('input').value||'Administración'), editadoEn:Date.now()})); ov.remove(); showToast('Registro anulado'); refresh(); }catch(e){ showToast('No se pudo anular.'); } };
      btns.appendChild(an);
    }
    btns.appendChild(cancel); btns.appendChild(save); box2.appendChild(btns);
    save.onclick = async ()=>{
      const quien = who.querySelector('input').value.trim();
      const falta = reg.campos.find(c=>c.req && !String(v[c.k]||'').trim());
      if(falta){ err.textContent = 'Falta: '+falta.l.replace(' *',''); return; }
      if(!quien){ err.textContent = 'Escribe tu nombre en "Quién registra".'; return; }
      lsSet('santafe_operador', quien);
      const now = Date.now();
      const out = rec ? Object.assign({}, rec, v, {editadoPor:quien, editadoEn:now}) : Object.assign({}, v, {id:nowId('rg'), reg:reg.id, creadoPor:quien, creadoEn:now});
      save.disabled = true; save.textContent = 'Guardando...';
      try{ await colSet(col, out.id, out); ov.remove(); showToast('Registro guardado'); const i = recs.findIndex(x=>x.id===out.id); if(i>=0) recs[i]=out; else recs.unshift(out); loaded = true; draw(); refresh(); }
      catch(e){ save.disabled=false; save.textContent='Guardar'; err.textContent='No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.'; }
    };
    ov.appendChild(box2); document.body.appendChild(ov);
  }
  draw(); refresh();
  return wrap;
}

async function invLoad(force){
  if(state._inv && state._inv.loaded && !force) return state._inv;
  const inv = state._inv || {open:null, cfg:invDefaults(), stock:{}, codes:{}, loaded:false};
  const m = await storageMode();
  const p = (raw,fb)=> raw ? JSON.parse(raw) : fb;
  if(m==='remote'){
    const j = await remote({op:'multi', keys:['kv/inv_open','kv/inv_cfg','kv/inv_units'], lists:['invstock/','invcod/']});
    inv.units = p(j.values['kv/inv_units'], {}); inv.open = p(j.values['kv/inv_open'], null); inv.cfg = Object.assign(invDefaults(), p(j.values['kv/inv_cfg'],{}));
    inv.stock = {}; parseDocs(j.lists['invstock/']).forEach(x=>{ if(x.k) inv.stock[x.k]=x; });
    inv.codes = {}; parseDocs(j.lists['invcod/']).forEach(x=>{ if(x.code) inv.codes[x.code]=x.key; });
  } else {
    inv.units = await getJSON('inv_units', {}); inv.open = await getJSON('inv_open', null); inv.cfg = Object.assign(invDefaults(), await getJSON('inv_cfg', {}));
    inv.stock = {}; (await colList('invstock')).forEach(x=>{ if(x.k) inv.stock[x.k]=x; });
    inv.codes = {}; (await colList('invcod')).forEach(x=>{ if(x.code) inv.codes[x.code]=x.key; });
  }
  if(!inv.open){ inv.open = INV_SEED.open; setJSON('inv_open', INV_SEED.open); }   // primera vez: las existencias del inventario se cargan solas
  inv.loaded = true; state._inv = inv; invPublishAlerts(inv); return inv;
}
// movs: [{id,tipo,item,label,cant,dep,destino,motivo,paciente,por,nota,ref}] — se registra y se actualiza la existencia en un solo paso
async function invMove(movs){
  const inv = await invLoad();
  const payload = movs.map(m=>{
    const ch = {};
    if(m.tipo==='entrada') ch[m.dep] = m.cant;
    else if(m.tipo==='salida') ch[m.dep] = -m.cant;
    else if(m.tipo==='traslado'){ ch[m.dep] = -m.cant; ch[m.destino] = m.cant; }
    else if(m.tipo==='ajuste') ch[m.dep] = m.cant;
    return {id:m.id, item:m.item, changes:ch, v:JSON.stringify(Object.assign({ts:Date.now()}, m))};
  });
  const mode = await storageMode();
  if(mode==='remote'){
    const j = await remote({op:'invmov', movs:payload});
    Object.keys(j.stocks||{}).forEach(k=>{ inv.stock[k] = j.stocks[k]; });
    invPublishAlerts(inv);
    return j;
  }
  for(const pl of payload){
    if(await colGet('invmov', pl.id)) continue;
    await colSet('invmov', pl.id, JSON.parse(pl.v));
    const st = Object.assign({k:pl.item}, inv.stock[pl.item]||{});
    Object.keys(pl.changes).forEach(d=>{ st[d] = (Number(st[d])||0) + pl.changes[d]; });
    await colSet('invstock', pl.item, st); inv.stock[pl.item] = st;
  }
  invPublishAlerts(inv);
  return {ok:true};
}
// Al confirmar Enfermería la aplicación de una unidad: descuenta 1 del depósito de Emergencia
async function invAutoOrden(order, apRec, nombre){
  try{
    if(!(order.fuente && order.fuente.key)) return;
    const info = buildAllItemsMap()[order.fuente.key]; if(!info || info.type==='proc') return;   // los procedimientos no son existencias
    const inv = await invLoad(); if(!inv.cfg.auto) return;
    await invMove([{id:'mv_'+apRec.id, tipo:'salida', item:order.fuente.key, label:order.medicamento, cant:1, dep:inv.cfg.depEmergencia,
      motivo:'Aplicación a paciente', paciente:order.paciente, por:nombre, ref:{orden:order.id, n:apRec.n}}]);
  }catch(e){ showToast('⚠ Se registró la aplicación, pero no se pudo descontar del inventario. Avisa a Administración.'); }
}
function suppliesOf(rec){
  const map = buildAllItemsMap(); const out = [];
  Object.keys(rec.items||{}).forEach(k=>{
    const it = rec.items[k]; if(!it || !it.checked) return; const info = map[k]; if(!info || isTask(info.type)) return;
    const mq = /^\s*(\d+(?:[.,]\d+)?)/.exec(it.cantidad||''); const c = mq ? parseFloat(mq[1].replace(',','.')) : 1;
    out.push({key:k, label:info.label, cant: c>0 ? c : 1});
  });
  return out;
}

function renderInventario(){
  const wrap = document.createElement('div');
  const isAdm = state.role==='admin';
  state.invTab = state.invTab || 'stock';
  const tabs = [['stock','Existencias'],['mover','Escanear / Mover'],['mov','Movimientos']].concat(isAdm ? [['cfg','Configuración']] : []);
  const bar = document.createElement('div'); bar.className='tabs';
  tabs.forEach(([k,l])=>{ const b = document.createElement('button'); b.className='tab-btn'+(state.invTab===k?' active':''); b.textContent=l; b.onclick = ()=>{ state.invTab=k; render(); }; bar.appendChild(b); });
  wrap.appendChild(bar);
  const body = document.createElement('div'); body.innerHTML = '<div class="empty-state">Cargando inventario...</div>'; wrap.appendChild(body);
  invLoad().then(inv=>{
    body.innerHTML = '';
    if(state.invTab==='stock') invStockView(inv, body);
    else if(state.invTab==='mover') invMoveView(inv, body);
    else if(state.invTab==='mov') invHistView(inv, body);
    else invCfgView(inv, body);
  }).catch((e)=>{ console.error(e); body.innerHTML = '<div class="empty-state">No se pudo cargar el inventario. Revisa tu conexión.</div>'; });
  return wrap;
}
function invAllKeys(inv){
  const set = new Set([...Object.keys(inv.open||{}), ...Object.keys(inv.stock)]); return [...set];
}
function invSearch(inv, q, limit){
  const toks = q.toLowerCase().split(/\s+/).filter(Boolean); if(!toks.length) return [];
  const keys = invAllKeys(inv); const map = buildAllItemsMap();
  Object.keys(map).forEach(k=>{ if(!map[k].deleted && !isTask(map[k].type) && keys.indexOf(k)<0) keys.push(k); });
  const out = [];
  for(const k of keys){ const l = invLabel(k).toLowerCase(); if(toks.every(t=>l.includes(t))){ out.push(k); if(out.length>=limit) break; } }
  return out;
}
function invStockView(inv, body){

  sel.innerHTML = `<option value="todos">Todos</option><option value="bajo">⚠ Bajo el mínimo</option><option value="con">Con existencia</option>`; bar.appendChild(sel); card.appendChild(bar);
  const tbl = document.createElement('div'); card.appendChild(tbl); body.appendChild(card);
  const q = (k)=> invQty(inv,k);

    const txt = bar.querySelector('input').value.toLowerCase().trim(); const f = sel.value;
    let keys = invAllKeys(inv).map(k=>({k, label:invLabel(k), q:q(k)}));
    if(txt){ const toks = txt.split(/\s+/); keys = keys.filter(x=>toks.every(t=>x.label.toLowerCase().includes(t))); }
    if(f==='bajo') keys = keys.filter(x=>x.q.min>0 && x.q.d1<x.q.min); if(f==='con') keys = keys.filter(x=>x.q.d1+x.q.d2+x.q.d3>0);
    keys.sort((a,b)=>a.label.localeCompare(b.label));
    const shown = keys.slice(0,150);
    let h = `<table class="price-table"><thead><tr><th>Producto</th><th>${escapeHtml(n.d1)}</th><th>${escapeHtml(n.d2)}</th><th>${escapeHtml(n.d3)}</th><th>Mín.</th><th>Unidad</th></tr></thead><tbody>`;
    const fq = (v,u)=> u>1 ? `${v}<div class="note" style="margin:0;">${Math.floor(v/u)} cajas + ${v%u}</div>` : String(v);
    shown.forEach(x=>{ const low = x.q.min>0 && x.q.d1<x.q.min; const u = invUnit(inv,x.k);
      h += `<tr><td>${escapeHtml(x.label)}</td><td${low?' style="color:var(--red);font-weight:700;"':''}>${fq(x.q.d1,u)}${low?' ⚠':''}</td><td>${fq(x.q.d2,u)}</td><td>${fq(x.q.d3,u)}</td><td>${x.q.min||'—'}</td><td><button class="btn-icon" data-k="${escapeHtml(x.k)}" title="Unidades por caja">${u>1?'📦 x'+u:'⚙ suelto'}</button></td></tr>`; });
    h += '</tbody></table>' + (keys.length>shown.length ? `<div class="note" style="margin-top:6px;">Se muestran ${shown.length} de ${keys.length}. Escribe en el buscador para ver más.</div>` : '') + (keys.length===0?'<div class="empty-state">Sin resultados.</div>':'');
    tbl.innerHTML = h;
    tbl.querySelectorAll('button[data-k]').forEach(b=>{ b.onclick = ()=> openUnit(b.dataset.k); });
  }
  function openUnit(key){
    const ov = document.createElement('div'); ov.className='modal-ov'; const u = invUnit(inv,key);
    ov.innerHTML = `<div class="modal-box" style="max-width:420px;"><h2 style="margin:0 0 6px;color:var(--navy);font-size:15px;">${escapeHtml(invLabel(key))}</h2>
      <p class="note">¿Cuántas unidades sueltas trae cada caja o envase de este producto? Si se maneja <b>suelto</b> (una tableta, una ampolla, una pieza), deja <b>1</b>.</p>
      <div class="field" style="max-width:200px;margin:10px 0;"><label>Unidades por caja</label><input type="number" min="1" step="1" id="un-n" value="${u}"></div>
      <div style="display:flex;gap:8px;justify-content:flex-end;"><button class="btn-outline" id="un-no">Cancelar</button><button class="btn-primary" id="un-ok">Guardar</button></div></div>`;
    document.body.appendChild(ov);
    ov.querySelector('#un-no').onclick = ()=> ov.remove();
    ov.querySelector('#un-ok').onclick = async ()=>{
      const nn = Math.max(1, parseInt(ov.querySelector('#un-n').value,10)||1); inv.units = inv.units || {};
      if(nn>1) inv.units[key] = nn; else delete inv.units[key];
      if(await setJSON('inv_units', inv.units)){ ov.remove(); showToast('Guardado'); draw(); }

  bar.querySelector('input').oninput = draw; sel.onchange = draw; draw();

      try{ const c = sanCode(code); await colSet('invcod', c, {code:c, key:k, por:lsGet('santafe_operador'), ts:Date.now()}); inv.codes[c]=k; }catch(e){ showToast('No se pudo guardar el código (se usará solo esta vez).'); }
      ov.remove(); addToCart(k,1); scan.focus(); }; r.appendChild(b); }); };

// ================= ASISTENCIA (entrada / salida con código QR) =================
const DIAS_N = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const DIAS_ORD = [1,2,3,4,5,6,0];                       // Lunes a Domingo
function hnParts(ts){ const d = new Date(ts - 6*3600000); const z=n=>String(n).padStart(2,'0'); return {iso:d.toISOString().slice(0,10), mes:d.toISOString().slice(0,7), dow:d.getUTCDay(), min:d.getUTCHours()*60+d.getUTCMinutes(), hhmm:z(d.getUTCHours())+':'+z(d.getUTCMinutes())}; }
function toMin(hhmm){ const m = /^(\d{1,2}):(\d{2})$/.exec(hhmm||''); return m ? (+m[1])*60+(+m[2]) : null; }
function hora12(ts){ try{ return new Date(ts).toLocaleTimeString('es-HN',{hour:'2-digit',minute:'2-digit',timeZone:'America/Tegucigalpa'}); }catch(e){ return hnParts(ts).hhmm; } }
const getEmps = ()=> getJSON('emp_list', [], true);
async function saveEmpsMerged(mut){          // lee lo último, aplica el cambio y guarda (evita pisar cambios de otra persona)
  const cur = await getEmps(); const next = mut(cur.slice()); const ok = await setJSON('emp_list', next); return ok ? next : null;
}
function newToken(){ const a = new Uint8Array(9); (window.crypto||{getRandomValues:(x)=>{ for(let i=0;i<x.length;i++) x[i]=Math.floor(Math.random()*256); }}).getRandomValues(a); return [...a].map(b=>'abcdefghjkmnpqrstuvwxyz23456789'[b%31]).join(''); }
function empUrl(e){ return location.origin + location.pathname + '?m=' + e.token; }
function scanUrl(){ return location.origin + location.pathname + '?m=scan'; }
function horarioResumen(h){
  if(!h) return 'Sin horario';
  const grp = []; DIAS_ORD.forEach(d=>{ const x=h[d]; if(!x||!x.e||!x.s) return; const k=x.e+'–'+x.s; const last=grp[grp.length-1]; if(last && last.k===k && last.fin===d-1+(d===0?7:0)) { last.fin=d||7; last.fin = d===0?7:d; } else grp.push({k, ini:d, fin:d===0?7:d}); });
  const nm = (d)=> DIAS_N[d===7?0:d].slice(0,3);
  return grp.map(g=> (g.ini===(g.fin===7?0:g.fin) ? nm(g.ini) : nm(g.ini)+'–'+nm(g.fin)) + ' ' + g.k).join(' · ') || 'Sin horario';
}
function asEstado(emp, m){
  if(!emp) return {t:'',k:''};
  const tol = (emp.tol==null||emp.tol==='') ? 10 : +emp.tol; const p = hnParts(m.ts); const H = (d)=> emp.horario && emp.horario[d];
  if(m.tipo==='entrada'){
    const sch = H(p.dow); if(!sch || !sch.e) return {t:'Día libre / extra', k:'libre'};
    const diff = p.min - toMin(sch.e); return diff<=tol ? {t:'A tiempo',k:'ok'} : {t:'Tarde '+diff+' min',k:'tarde',min:diff};
  }
  const prev = H((p.dow+6)%7); let se;
  if(prev && prev.e && prev.s && toMin(prev.s)<toMin(prev.e) && p.min < toMin(prev.e)) se = toMin(prev.s);      // turno nocturno: salida de madrugada
  else { const sch = H(p.dow); if(!sch || !sch.s) return {t:'Día libre / extra', k:'libre'}; se = toMin(sch.s); }
  const diff = p.min - se;
  if(diff < -tol) return {t:'Salida anticipada '+(-diff)+' min', k:'antic', min:-diff};
  if(diff > tol) return {t:'Hora extra '+diff+' min', k:'extra', min:diff};
  return {t:'Cumplido', k:'ok'};
}
function asPairs(marks){
  const out = []; let open = null;
  marks.slice().sort((a,b)=>a.ts-b.ts).forEach(m=>{
    if(m.tipo==='entrada'){ if(open) out.push({e:open,s:null}); open = m; }
    else if(open && (m.ts-open.ts) < 20*3600000){ out.push({e:open,s:m}); open = null; }
    else out.push({e:null,s:m});
  });
  if(open) out.push({e:open,s:null});
  return out;
}

// ---- código QR como imagen vectorial (SVG) ----
function qrSvg(url, caption, sub){
  const qr = QRGEN(0,'M'); qr.addData(url); qr.make(); const n = qr.getModuleCount(); const mg = 4; const sz = n+mg*2;
  let d = ''; for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(qr.isDark(r,c)) d += 'M'+(c+mg)+' '+(r+mg)+'h1v1h-1z';
  const cap = caption ? `<text x="${sz/2}" y="${sz+2.2}" text-anchor="middle" font-family="Arial,sans-serif" font-size="2.4" font-weight="700" fill="#1f3b5c">${escapeHtml(caption)}</text>` : '';
  const sb = sub ? `<text x="${sz/2}" y="${sz+4.6}" text-anchor="middle" font-family="Arial,sans-serif" font-size="1.5" fill="#555">${escapeHtml(sub)}</text>` : '';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${sz} ${sz+(caption?6:0)}" width="100%"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/>${cap}${sb}</svg>`;
}
function downloadSvgAsPng(svg, filename){
  const img = new Image(); const url = URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
  img.onload = ()=>{ const c = document.createElement('canvas'); c.width = 900; c.height = Math.round(900*img.height/img.width) || 1000; const x = c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
    const a = document.createElement('a'); a.href = c.toDataURL('image/png'); a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); };
  img.src = url;
}
function downloadText(filename, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text],{type:type||'text/csv;charset=utf-8'})); a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); }

function asRepView(emps, body){
  const card = document.createElement('div'); card.className='card'; card.innerHTML = `<h2>📊 Reporte de asistencia</h2>`;
  const mesHoy = hnParts(Date.now()).mes; let mes = state.asMes || mesHoy; let empSel = '';
  const bar = document.createElement('div'); bar.className='search-bar'; bar.innerHTML = `<input type="month" value="${mes}" style="padding:8px;border:1px solid var(--border);border-radius:8px;"><select style="padding:8px;border:1px solid var(--border);border-radius:8px;"><option value="">Todos los empleados</option>${emps.map(e=>`<option value="${e.id}">${escapeHtml(e.nombre)}</option>`).join('')}</select>`;
  const xb1 = document.createElement('button'); xb1.className='btn-outline'; xb1.textContent='⬇ Descargar detalle (Excel)'; const xb2 = document.createElement('button'); xb2.className='btn-outline'; xb2.textContent='⬇ Descargar resumen (Excel)';
  bar.appendChild(xb1); bar.appendChild(xb2); card.appendChild(bar); const out = document.createElement('div'); card.appendChild(out); body.appendChild(card);
  let marks = []; let rowsDet = [], rowsSum = [];
  const byId = {}; emps.forEach(e=>byId[e.id]=e);
  function build(){
    rowsDet = []; rowsSum = [];
    const grp = {}; marks.filter(m=>!m.anulado && (!empSel || m.emp===empSel)).forEach(m=>{ (grp[m.emp]=grp[m.emp]||[]).push(m); });
    Object.keys(grp).forEach(id=>{
      const e = byId[id] || {nombre:(grp[id][0]||{}).nombre||id, horario:{}}; const prs = asPairs(grp[id]);
      const sum = {nombre:e.nombre, dias:new Set(), horas:0, tardes:0, minTarde:0, extras:0, minExtra:0, antic:0, faltas:0};
      prs.forEach(pr=>{
        const es = pr.e ? asEstado(e, pr.e) : null, ss = pr.s ? asEstado(e, pr.s) : null; const h = (pr.e && pr.s) ? (pr.s.ts-pr.e.ts)/3600000 : 0;
        const ref = pr.e || pr.s; const p = hnParts(ref.ts);
        sum.dias.add(p.iso); sum.horas += h; if(es && es.k==='tarde'){ sum.tardes++; sum.minTarde += es.min; } if(ss && ss.k==='extra'){ sum.extras++; sum.minExtra += ss.min; } if(ss && ss.k==='antic') sum.antic++; if(!pr.e || !pr.s) sum.faltas++;
        rowsDet.push({emp:e.nombre, cargo:e.cargo||'', fecha:p.iso, dia:DIAS_N[p.dow], entrada:pr.e?hnParts(pr.e.ts).hhmm:'—', estE:pr.e?es.t+(pr.e.manual?' (manual)':''):'Falta entrada', salida:pr.s?hnParts(pr.s.ts).hhmm:'—', estS:pr.s?ss.t+(pr.s.manual?' (manual)':''):'Falta salida', horas:h?h.toFixed(2):'', ids:[pr.e&&pr.e.id, pr.s&&pr.s.id].filter(Boolean)});
      });
      rowsSum.push({nombre:e.nombre, dias:sum.dias.size, horas:sum.horas.toFixed(2), tardes:sum.tardes, minTarde:sum.minTarde, extras:sum.extras, minExtra:sum.minExtra, antic:sum.antic, faltas:sum.faltas});
    });
    rowsDet.sort((a,b)=>(a.emp+a.fecha).localeCompare(b.emp+b.fecha)); rowsSum.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  }
  function draw(){
    build(); if(!rowsDet.length){ out.innerHTML = '<div class="empty-state">No hay marcajes en este mes.</div>'; return; }
    let h = `<h3 style="font-size:14px;color:var(--navy);margin:14px 0 6px;">Resumen del mes</h3><div style="overflow:auto;"><table class="price-table"><thead><tr><th>Empleado</th><th>Días</th><th>Horas</th><th>Tardanzas</th><th>Min. tarde</th><th>Horas extra (veces)</th><th>Salidas anticipadas</th><th>Marcajes incompletos</th></tr></thead><tbody>`;
    rowsSum.forEach(r=>{ h += `<tr><td>${escapeHtml(r.nombre)}</td><td>${r.dias}</td><td>${r.horas}</td><td>${r.tardes}</td><td>${r.minTarde}</td><td>${r.extras}</td><td>${r.antic}</td><td>${r.faltas}</td></tr>`; });
    h += `</tbody></table></div><h3 style="font-size:14px;color:var(--navy);margin:14px 0 6px;">Detalle</h3><div style="overflow:auto;"><table class="price-table"><thead><tr><th>Empleado</th><th>Fecha</th><th>Entrada</th><th>Estado</th><th>Salida</th><th>Estado</th><th>Horas</th><th></th></tr></thead><tbody>`;
    rowsDet.forEach((r,i)=>{ h += `<tr><td>${escapeHtml(r.emp)}</td><td>${fmtFecha(r.fecha)} <span class="note">${r.dia.slice(0,3)}</span></td><td>${r.entrada}</td><td>${escapeHtml(r.estE)}</td><td>${r.salida}</td><td>${escapeHtml(r.estS)}</td><td>${r.horas}</td><td><button class="btn-icon" data-i="${i}" title="Anular marcaje">🗑</button></td></tr>`; });
    out.innerHTML = h + '</tbody></table></div>';
    out.querySelectorAll('button[data-i]').forEach(b=>{ b.onclick = async ()=>{ const r = rowsDet[+b.dataset.i]; if(!(await showConfirm('¿Anular este marcaje de '+r.emp+' ('+fmtFecha(r.fecha)+')? Dejará de contarse en el reporte.'))) return;
      for(const id of r.ids){ const m = marks.find(x=>x.id===id); if(m){ try{ await colSet('asist_'+mes, id, Object.assign({}, m, {anulado:true, anuladoEn:Date.now()})); m.anulado = true; }catch(e){ showToast('No se pudo anular.'); } } } draw(); }; });
  }
  async function load(){ out.innerHTML = '<div class="empty-state">Cargando...</div>'; try{ marks = await colList('asist_'+mes); }catch(e){ out.innerHTML = '<div class="empty-state">No se pudo cargar.</div>'; return; } draw(); }
  const [mi, si] = bar.querySelectorAll('input,select'); mi.onchange = ()=>{ mes = mi.value || mesHoy; state.asMes = mes; load(); }; si.onchange = ()=>{ empSel = si.value; draw(); };
  const csv = (rows, cols)=>{ const esc = v=>'"'+String(v===undefined||v===null?'':v).replace(/"/g,'""')+'"'; return '\ufeff'+[cols.map(c=>esc(c[1])).join(',')].concat(rows.map(r=>cols.map(c=>esc(r[c[0]])).join(','))).join('\r\n'); };
  xb1.onclick = ()=> downloadText('asistencia_detalle_'+mes+'.csv', csv(rowsDet, [['emp','Empleado'],['cargo','Cargo'],['fecha','Fecha'],['dia','Día'],['entrada','Entrada'],['estE','Estado de entrada'],['salida','Salida'],['estS','Estado de salida'],['horas','Horas trabajadas']]));
  xb2.onclick = ()=> downloadText('asistencia_resumen_'+mes+'.csv', csv(rowsSum, [['nombre','Empleado'],['dias','Días trabajados'],['horas','Horas'],['tardes','Tardanzas'],['minTarde','Minutos tarde'],['extras','Veces con hora extra'],['minExtra','Minutos de hora extra'],['antic','Salidas anticipadas'],['faltas','Marcajes incompletos']]));
  load();
}
