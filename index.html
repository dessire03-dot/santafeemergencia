function renderResumen(){
  const wrap = document.createElement('div');
  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>📊 Resumen de consumo</h2><p class="note">Solo Administración puede ver estos resúmenes.</p>`;

  const subTabs = document.createElement('div'); subTabs.className='tabs'; subTabs.style.marginTop='10px';
  const groups = [['dia','Por día'],['medico','Por médico'],['paciente','Por paciente'],['hosp','Hospitalizados']];
  let activeGroup = 'dia';
  const btns = {};
  groups.forEach(([key,label])=>{
    const b = document.createElement('button'); b.className='tab-btn'+(key===activeGroup?' active':''); b.textContent=label;
    b.onclick = ()=>{ activeGroup=key; Object.keys(btns).forEach(kk=>btns[kk].classList.toggle('active', kk===key)); loadAndRender(); };
    btns[key]=b; subTabs.appendChild(b);
  });
  card.appendChild(subTabs);

  const tableWrap = document.createElement('div');
  tableWrap.innerHTML = `<div class="empty-state">Cargando...</div>`;
  card.appendChild(tableWrap);
  wrap.appendChild(card);

  async function loadAndRender(){
    tableWrap.innerHTML = `<div class="empty-state">Cargando...</div>`;
    if(activeGroup==='hosp'){
      const hi = await getIndex('hospitalizaciones'); const rows=[];
      for(const it of hi){ const r = await getAtencion(it.id,'hospitalizaciones'); if(r){ const st=stayTotals(r); rows.push([r.nombre+(r.estado==='alta'?' (alta)':''), st.perDay.filter(d=>d.n>0).length, st.total]); } }
      rows.sort((a,b)=>b[2]-a[2]);
      if(rows.length===0){ tableWrap.innerHTML = `<div class="empty-state">No hay pacientes hospitalizados registrados.</div>`; return; }
      const t = document.createElement('table'); t.className='price-table';
      t.innerHTML = `<thead><tr><th>Paciente</th><th>Días</th><th>Total acumulado</th></tr></thead>`;
      const tb = document.createElement('tbody');
      rows.forEach(r=>{ const tr=document.createElement('tr'); tr.innerHTML=`<td>${escapeHtml(r[0])}</td><td>${r[1]}</td><td style="font-weight:700;color:var(--teal);">${money(r[2])}</td>`; tb.appendChild(tr); });
      t.appendChild(tb); tableWrap.innerHTML=''; tableWrap.appendChild(t);
      const tot = document.createElement('div'); tot.className='total-bar'; tot.style.marginTop='14px';
      tot.innerHTML = `<span>Total hospitalizados<br><span class="sub">${rows.length} paciente(s)</span></span><span>${money(rows.reduce((n,r)=>n+r[2],0))}</span>`;
      tableWrap.appendChild(tot); return;
    }
    state.index = await getIndex();
    const recs = [];
    for(const it of state.index){
      const r = await getAtencion(it.id);
      if(r) recs.push(r);
    }
    const groupKeyFn = activeGroup==='dia' ? (r=>r.fecha||'(sin fecha)')
      : activeGroup==='medico' ? (r=>r.medico||'(sin médico)')
      : (r=>r.nombre||'(sin nombre)');

    const agg = {};
    recs.forEach(r=>{
      const g = groupKeyFn(r);
      const {total} = computeTotal(r);
      if(!agg[g]) agg[g] = {count:0, total:0};
      agg[g].count += 1;
      agg[g].total += total;
    });
    const rows = Object.entries(agg).sort((a,b)=> b[1].total - a[1].total);

    if(rows.length===0){
      tableWrap.innerHTML = `<div class="empty-state">No hay atenciones registradas todavía.</div>`;
      return;
    }
    const grandTotal = rows.reduce((n,[,v])=>n+v.total,0);
    const grandCount = rows.reduce((n,[,v])=>n+v.count,0);

    const table = document.createElement('table'); table.className='price-table';
    const colLabel = activeGroup==='dia'?'Fecha':activeGroup==='medico'?'Médico':'Paciente';
    table.innerHTML = `<thead><tr><th>${colLabel}</th><th>Atenciones</th><th>Total consumido</th></tr></thead>`;
    const tbody = document.createElement('tbody');
    rows.forEach(([g,v])=>{
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${escapeHtml(g)}</td><td>${v.count}</td><td style="font-weight:700;color:var(--teal);">${money(v.total)}</td>`;
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tableWrap.innerHTML='';
    tableWrap.appendChild(table);

    const totalBar = document.createElement('div'); totalBar.className='total-bar'; totalBar.style.marginTop='14px';
    totalBar.innerHTML = `<span>Total general<br><span class="sub">${grandCount} atenciones registradas</span></span><span>${money(grandTotal)}</span>`;
    tableWrap.appendChild(totalBar);
  }
  loadAndRender();

  return wrap;
}

function renderPrecios(){
  const wrap = document.createElement('div');

  const addBox = document.createElement('div'); addBox.className='add-item-box';
  addBox.innerHTML = `<h3>➕ Agregar nuevo insumo o medicamento</h3>`;
  const addGrid = document.createElement('div'); addGrid.className='add-item-grid';
  const catNames = allCategoryNames();
  addGrid.innerHTML = `
    <div class="field">
      <label>Categoría</label>
      <select id="add-cat">
        ${catNames.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}
        <option value="__new__">+ Nueva categoría...</option>
      </select>
    </div>
    <div class="field">
      <label>Tipo</label>
      <select id="add-type">
        <option value="supply">Insumo (solo cantidad)</option>
        <option value="med">Medicamento (cantidad + indicación)</option>
        <option value="proc">Procedimiento (cantidad + indicación)</option>
      </select>
    </div>
    <div class="field">
      <label>Nombre del ítem</label>
      <input type="text" id="add-label" placeholder="Ej. Guantes talla 9">
    </div>
    <div class="field">
      <label>Detalle (opcional)</label>
      <input type="text" id="add-extra" placeholder="Ej. Tamaño ____">
    </div>
    <button class="btn-primary" id="add-btn">Agregar</button>
  `;
  addBox.appendChild(addGrid);
  const newCatRow = document.createElement('div'); newCatRow.className='new-cat-row'; newCatRow.style.display='none';
  newCatRow.innerHTML = `<input type="text" id="new-cat-name" placeholder="Nombre de la nueva categoría">`;
  addBox.appendChild(newCatRow);
  wrap.appendChild(addBox);

  const catSelect = addGrid.querySelector('#add-cat');
  const typeSelect = addGrid.querySelector('#add-type');

  function typeForCategory(name){
    const base = BASE_CATEGORIES.find(c=>c.name===name);
    if(base) return base.type;
    const cc = state.customCats.find(c=>c.name===name);
    if(cc) return cc.type;
    return null;
  }
  function updateTypeLock(){
    if(catSelect.value!=='__new__'){
      newCatRow.style.display='none';
      const t = typeForCategory(catSelect.value);
      if(t){ typeSelect.value = t; typeSelect.disabled = true; } else { typeSelect.disabled=false; }
    } else {
      newCatRow.style.display='flex';
      typeSelect.disabled = false;
    }
  }
  catSelect.onchange = updateTypeLock;
  updateTypeLock();

  addGrid.querySelector('#add-btn').onclick = async ()=>{
    const labelInp = addGrid.querySelector('#add-label');
    const extraInp = addGrid.querySelector('#add-extra');
    const label = labelInp.value.trim();
    if(!label){ showToast('Escribe el nombre del ítem'); return; }
    let catName = catSelect.value;
    const type = typeSelect.value;
    if(catName==='__new__'){
      catName = newCatRow.querySelector('#new-cat-name').value.trim();
      if(!catName){ showToast('Escribe el nombre de la nueva categoría'); return; }
      if(!state.customCats.find(c=>c.name===catName) && !BASE_CATEGORIES.find(c=>c.name===catName)){
        state.customCats.push({name:catName, type});
        await saveCustomCats(state.customCats);
      }
    }
    const newItem = { id: nowId('c'), catName, label, extra: extraInp.value.trim()||null, type };
    state.customItems.push(newItem);
    await saveCustomItems(state.customItems);
    showToast('Ítem agregado');
    render();
  };

  const card = document.createElement('div'); card.className='card';
  card.innerHTML = `<h2>Insumos y medicamentos</h2><p class="note">Aquí defines el <b>precio de venta</b> que se cobra al paciente por cada insumo — esto es lo que ve Enfermería y Administración para calcular el total consumido. El médico nunca ve esta pantalla. Cuando existe, se muestra también el <b>último costo de compra</b> conocido como referencia (no es lo que se cobra). Puedes eliminar ítems que ya no se usen (el historial de atenciones pasadas no se altera).</p>`;

  const suggCount = Object.keys(SUGGESTED_SALE_PRICES).length;
  if(suggCount > 0){
    const suggBox = document.createElement('div');
    suggBox.style.cssText = 'background:#eafaf3;border:1px solid var(--green);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;';
    suggBox.innerHTML = `<span>💰 Hay <b>${suggCount}</b> precios de venta del inventario (15/10/2026). Ya se usan por defecto; este botón sirve para restablecer todos a esos valores.</span>`;
    const suggBtn = document.createElement('button'); suggBtn.className='btn-outline btn-sm'; suggBtn.textContent='Restablecer precios al inventario';
    suggBtn.onclick = async ()=>{
      if(!(await showConfirm('Esto llenará el precio de venta de '+suggCount+' ítems con el precio sugerido (costo + margen + ISV). Los precios que ya hayas definido a mano para esos mismos ítems se sobrescribirán. ¿Continuar?'))) return;
      Object.keys(SUGGESTED_SALE_PRICES).forEach(k=>{ state.precios[k] = SUGGESTED_SALE_PRICES[k]; });
      await savePrecios(state.precios);
      showToast('Precios de venta sugeridos cargados');
      render();
    };
    suggBox.appendChild(suggBtn);
    card.appendChild(suggBox);
  }

  const searchBar = document.createElement('div'); searchBar.className='search-bar';
  searchBar.innerHTML = `<input type="text" placeholder="Buscar insumo...">`;
  const input = searchBar.querySelector('input');
  card.appendChild(searchBar);

  const tableWrap = document.createElement('div'); tableWrap.style.maxHeight='60vh'; tableWrap.style.overflow='auto';
  const table = document.createElement('table'); table.className='price-table';
  table.innerHTML = `<thead><tr><th>Ítem</th><th>Categoría</th><th>Costo de compra (ref.)</th><th>Precio de venta (L.)</th><th></th></tr></thead>`;
  const tbody = document.createElement('tbody');
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);

  const saveBar = document.createElement('div'); saveBar.style.marginTop='12px'; saveBar.style.textAlign='right';
  const saveBtn = document.createElement('button'); saveBtn.className='btn-primary'; saveBtn.textContent='Guardar precios';
  let dirty = {};
  saveBtn.onclick = async ()=>{
    Object.assign(state.precios, dirty);
    await savePrecios(state.precios);
    dirty = {};
    showToast('Precios guardados');
  };
  saveBar.appendChild(saveBtn);
  card.appendChild(saveBar);
  wrap.appendChild(card);

  function refresh(filter){
    tbody.innerHTML='';
    const effCats = buildEffectiveCategories();
    effCats.forEach(cat=>{
      const matching = cat.items.filter(it=> !filter || it.label.toLowerCase().includes(filter.toLowerCase()));
      if(matching.length===0) return;
      const catRow = document.createElement('tr'); catRow.className='cat-header-row';
      catRow.innerHTML = `<td colspan="4">${escapeHtml(cat.name)}${cat.isCustomCat?' (nueva)':''}</td>`;
      tbody.appendChild(catRow);
      matching.forEach(it=>{
        const k = it.key;
        const tr = document.createElement('tr');
        const cost = PURCHASE_COSTS[k];
        const suggested = SUGGESTED_SALE_PRICES[k];
        tr.innerHTML = `
          <td>${escapeHtml(it.label)}</td>
          <td style="color:var(--text-mut);font-size:11px;">${cat.type==='med'?'Medicamento':(cat.type==='proc'?'Procedimiento':'Insumo')}</td>
          <td>${cost ? `<span class="price-tag" title="${escapeHtml(cost.source)}">L.${cost.cost.toFixed(2)}</span>` : '<span style="color:#c4ccd3;">—</span>'}</td>
          <td>
            <input type="number" step="0.01" min="0" class="price-input" value="${effPrice(k)||''}" placeholder="0.00">
            ${suggested!=null ? `<div style="font-size:10px;color:var(--green);margin-top:2px;">inventario: L.${suggested.toFixed(2)}</div>` : ''}
          </td>
          <td><button class="btn-icon" title="Eliminar ítem">🗑</button></td>
        `;
        tr.querySelector('input').oninput = (e)=>{ dirty[k] = e.target.value===''? 0 : Number(e.target.value); };
        tr.querySelector('button').onclick = async ()=>{
          if(!(await showConfirm('¿Eliminar "'+it.label+'"? Ya no aparecerá para nuevas atenciones, pero el historial existente no cambia.'))) return;
          state.deleted.push(k);
          await saveDeleted(state.deleted);
          showToast('Ítem eliminado');
          render();
        };
        tbody.appendChild(tr);
      });
    });
  }
  refresh('');
  input.oninput = ()=> refresh(input.value);

  return wrap;
}

render();
// Precarga en segundo plano mientras la persona elige su rol (hace que los clics siguientes sean rápidos)
if(getApi() && !window.storage && !state.marcarTok){ ensureConfig(); }
</script>
</body>
</html>
